<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Дока ИСИП</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./css/style.css?v=20261107-3">
  <link rel="stylesheet" href="./css/admin.css?v=20261108-2">
  <style>:root { --domain-accent: #614fa8; }</style>
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <a href="index.html" class="brand-badge">U•ᴥ•U Дока ИСИП</a>
      <div class="breadcrumbs">
        <span>/</span>
        <span class="current" id="headerBreadcrumb">...</span>
      </div>
    </div>
    <div class="header-right">
      <button class="search-trigger-btn" id="searchTriggerBtn">Поиск <kbd>/</kbd></button>
    </div>
  </header>

  <div class="domain-layout">
    <aside class="domain-sidebar">
      <h1 id="domainTitle">...</h1>
      <p id="domainDesc">...</p>
    </aside>

    <main class="domain-content" id="groupsContainer">
      <!-- Группы и темы строятся скриптом -->
    </main>
  </div>

  <div class="search-modal" id="searchModal">
    <div class="search-box">
      <input type="text" class="search-box-input" id="searchInput" placeholder="Поиск по доке..." autocomplete="off">
      <ul class="search-results-list" id="searchResults"></ul>
    </div>
  </div>

  <script src="./js/search.js?v=20261108-1"></script>
  <script src="./js/admin.js?v=20261108-2"></script>
  <script>
    (function () {
      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      async function loadDomain() {
        const params = new URLSearchParams(window.location.search);
        const domainId = params.get('id') || 'csharp';

        try {
          const res = await fetch('./data/structure.json');
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const domain = data[domainId];

          if (!domain) {
            document.body.innerHTML = '<h1 style="padding:40px;">Область не найдена</h1>';
            return;
          }

          // Применяем тему и акцент
          document.body.setAttribute('data-domain', domainId);
          document.documentElement.style.setProperty('--domain-accent', domain.accent || '#6c47ff');
          document.title = `${domain.title || domainId} — Дока ИСИП`;

          // Заполняем сайдбар и хедер
          document.getElementById('headerBreadcrumb').textContent = domain.title || domainId;
          document.getElementById('domainTitle').textContent = domain.title || domainId;
          document.getElementById('domainDesc').textContent = domain.description || '';

          const groups = [...(domain.groups || [])].sort(
            (a, b) => (a.order ?? 0) - (b.order ?? 0)
          );

          const adminAvailable = window.DokaAdmin
            ? await window.DokaAdmin.ready()
            : false;

          const container = document.getElementById('groupsContainer');

          const groupsHtml = groups
            .map((group) => {
              const topics = [...(group.topics || [])].sort(
                (a, b) => (a.order ?? 0) - (b.order ?? 0)
              );
              const topicsHtml = topics
                .map((t) => {
                  const href = t.type === 'md'
                    ? `theme.html?path=${encodeURI(t.url)}`
                    : escapeHtml(t.url);
                  const badge = t.interactive ? ' 🔧' : '';
                  const orderInput = adminAvailable
                    ? `<input type="number" class="doka-order-input" min="0" step="10"
                        value="${Number(t.order ?? 0)}"
                        data-kind="topic"
                        data-domain="${escapeHtml(domainId)}"
                        data-group="${escapeHtml(group.id || '')}"
                        data-url="${escapeHtml(t.url)}"
                        data-order="${Number(t.order ?? 0)}"
                        aria-label="Порядок темы «${escapeHtml(t.title)}»">`
                    : '';
                  const editButton = adminAvailable
                    ? `<button type="button" class="doka-edit-topic" data-path="${escapeHtml(t.url)}" title="Редактировать тему" aria-label="Редактировать тему">✎</button>`
                    : '';
                  return `<div class="topic-row">
                    <a class="topic-link" href="${href}">${escapeHtml(t.title)}${badge}</a>
                    ${orderInput}
                    ${editButton}
                  </div>`;
                })
                .join('');

              const addTopic = adminAvailable
                ? `<button type="button" class="doka-add-topic" data-group="${escapeHtml(group.id || '')}">+ тема</button>`
                : '';

              const groupTools = adminAvailable
                ? `<span class="doka-group-tools">
                    <input type="number" class="doka-order-input" min="0" step="10"
                      value="${Number(group.order ?? 0)}"
                      data-kind="group"
                      data-domain="${escapeHtml(domainId)}"
                      data-group="${escapeHtml(group.id || '')}"
                      data-order="${Number(group.order ?? 0)}"
                      aria-label="Порядок группы «${escapeHtml(group.name)}»">
                    <button type="button" class="doka-edit-group"
                      data-group="${escapeHtml(group.id || '')}"
                      data-title="${escapeHtml(group.name)}"
                      title="Редактировать группу"
                      aria-label="Редактировать группу «${escapeHtml(group.name)}»">✎</button>
                  </span>`
                : '';

              return `
                <section class="group-section" id="group-${escapeHtml(group.id || '')}">
                  <div class="group-header">
                    <span class="group-name">${escapeHtml(group.name)}</span>
                    ${groupTools}
                  </div>
                  <div class="topics-columns">
                    ${topicsHtml}
                    ${addTopic}
                  </div>
                </section>`;
            })
            .join('');

          const addGroup = adminAvailable
            ? `<div class="group-section doka-add-group">
                 <button type="button" class="doka-add-group-btn doka-add-btn">+ группа</button>
               </div>`
            : '';

          if (groups.length) {
            container.innerHTML = groupsHtml + addGroup;
          } else if (adminAvailable) {
            container.innerHTML =
              '<p style="color: var(--text-muted);">В этой области пока нет групп. Создайте первую группу.</p>' +
              addGroup;
          } else {
            container.innerHTML =
              '<p style="color: var(--text-muted);">В этой области пока нет тем.</p>';
          }

          if (adminAvailable && window.DokaAdmin) {
            window.DokaAdmin.bindDomainPage(domainId);
          }
        } catch (err) {
          console.error('[domain] Не удалось загрузить structure.json:', err);
          document.getElementById('groupsContainer').innerHTML =
            '<p style="color: var(--text-muted);">Не удалось загрузить структуру.</p>';
        }
      }

      loadDomain();
    })();
  </script>
</body>
</html>
