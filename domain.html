<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Дока ИСИП</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">
<link rel="stylesheet" href="./css/style.css?v=20261113-4">
  <link rel="stylesheet" href="./css/admin.css?v=20261109-15">
  <style>:root { --domain-accent: #614fa8; }</style>
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <a href="index.html" class="brand-badge">U•ᴥ•U Дока ИСИП</a>
      <div class="breadcrumbs">
        <span>/</span>
        <span class="current" id="headerBreadcrumb">...</span>
      </div>
    </div>
    <div class="header-right">
      <button class="search-trigger-btn" id="searchTriggerBtn">Поиск <kbd>/</kbd></button>
    </div>
  </header>

  <div class="domain-layout">
    <aside class="domain-sidebar">
      <h1 id="domainTitle">...</h1>
      <p id="domainDesc">...</p>
    </aside>

    <main class="domain-content" id="groupsContainer">
      <!-- Группы и темы строятся скриптом -->
    </main>
  </div>

  <div class="search-modal" id="searchModal">
    <div class="search-box">
      <input type="text" class="search-box-input" id="searchInput" placeholder="Поиск по доке..." autocomplete="off">
      <ul class="search-results-list" id="searchResults"></ul>
    </div>
  </div>

  <script src="./js/search.js?v=20261109-3"></script>
  <script src="./js/progress.js?v=20261109-1"></script>
  <script src="./js/admin.js?v=20261113-1"></script>
  <script src="./js/admin-stats.js?v=20261109-7"></script>
  <script src="./js/mascot.js?v=20261109-7"></script>
  <script>
    (function () {
      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Группы с таким количеством тем (и больше) занимают всю ширину ряда,
      // чтобы длинный список не растягивал соседние карточки по высоте.
      const WIDE_GROUP_MIN_TOPICS = 9;

      function orderControlHtml({ kind, domain, group, url, order, label }) {
        const attrs = [
          'type="number"',
          'class="doka-order-input"',
          'min="0"',
          'step="10"',
          `value="${Number(order ?? 0)}"`,
          `data-kind="${escapeHtml(kind)}"`,
          domain ? `data-domain="${escapeHtml(domain)}"` : '',
          group ? `data-group="${escapeHtml(group)}"` : '',
          url ? `data-url="${escapeHtml(url)}"` : '',
          `data-order="${Number(order ?? 0)}"`,
          `aria-label="${escapeHtml(label)}"`,
        ]
          .filter(Boolean)
          .join(' ');

        return `<div class="doka-actions-order">
          <button type="button" class="doka-order-step" data-step="-10" aria-label="Уменьшить порядок на 10">&lt;</button>
          <input ${attrs}>
          <button type="button" class="doka-order-step" data-step="10" aria-label="Увеличить порядок на 10">&gt;</button>
        </div>`;
      }

      async function loadDomain() {
        const params = new URLSearchParams(window.location.search);
        const domainId = params.get('id') || 'csharp';

        try {
          const res = await fetch('./data/structure.json');
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const domain = data[domainId];

          if (!domain) {
            document.body.innerHTML = '<h1 style="padding:40px;">Область не найдена</h1>';
            return;
          }

          // Применяем тему и акцент
          document.body.setAttribute('data-domain', domainId);
          document.documentElement.style.setProperty('--domain-accent', domain.accent || '#6c47ff');
          document.title = `${domain.title || domainId} — Дока ИСИП`;

          // Заполняем сайдбар и хедер
          document.getElementById('headerBreadcrumb').textContent = domain.title || domainId;
          document.getElementById('domainTitle').textContent = domain.title || domainId;
          document.getElementById('domainDesc').textContent = domain.description || '';

          const groups = [...(domain.groups || [])].sort(
            (a, b) => (a.order ?? 0) - (b.order ?? 0)
          );
          const allowRename = !domain.localOnly;

          const adminAvailable = window.DokaAdmin
            ? await window.DokaAdmin.ready()
            : false;

          const container = document.getElementById('groupsContainer');

          const groupsHtml = groups
            .map((group) => {
              const topics = [...(group.topics || [])].sort(
                (a, b) => (a.order ?? 0) - (b.order ?? 0)
              );
              const topicsHtml = topics
                .map((t) => {
                  const href = t.type === 'md'
                    ? `theme.html?path=${encodeURI(t.url)}`
                    : escapeHtml(t.url);
                  const badge = t.interactive ? ' 🔧' : '';
                  const isRead = window.DokaProgress
                    ? window.DokaProgress.isRead(t.url)
                    : true;
                  const linkClass = 'topic-link' + (isRead ? '' : ' is-unread');
                  const actions = adminAvailable
                    ? `<details class="doka-actions"
                        data-kind="topic"
                        data-path="${escapeHtml(t.url)}"
                        data-title="${escapeHtml(t.title)}"
                        data-group="${escapeHtml(group.id || '')}"
                        data-order="${Number(t.order ?? 0)}">
                        <summary class="doka-actions-toggle" aria-haspopup="menu"
                          title="Действия с темой"
                          aria-label="Действия с темой «${escapeHtml(t.title)}»">›</summary>
                        <div class="doka-actions-menu" role="menu">
                          ${orderControlHtml({
                            kind: 'topic',
                            domain: domainId,
                            group: group.id || '',
                            url: t.url,
                            order: t.order,
                            label: `Порядок темы «${t.title}»`,
                          })}
                          <button type="button" class="doka-actions-item" data-action="edit">Редактировать</button>
                          ${allowRename ? '<button type="button" class="doka-actions-item" data-action="rename">Переименовать</button>' : ''}
                          <button type="button" class="doka-actions-item" data-action="move">Переместить</button>
                          <button type="button" class="doka-actions-item doka-actions-item--danger" data-action="delete">Удалить</button>
                        </div>
                      </details>`
                    : '';
                  return `<div class="topic-row">
                    <a class="${linkClass}" data-topic-url="${escapeHtml(t.url)}" href="${href}">${escapeHtml(t.title)}${badge}</a>
                    ${actions}
                  </div>`;
                })
                .join('');

              const addTopic = adminAvailable
                ? `<button type="button" class="doka-add-topic" data-group="${escapeHtml(group.id || '')}">+ тема</button>`
                : '';

              const groupTools = adminAvailable
                ? `<span class="doka-group-tools">
                    <details class="doka-actions"
                      data-kind="group"
                      data-group="${escapeHtml(group.id || '')}"
                      data-title="${escapeHtml(group.name)}"
                      data-order="${Number(group.order ?? 0)}">
                      <summary class="doka-actions-toggle" aria-haspopup="menu"
                        title="Действия с группой"
                        aria-label="Действия с группой «${escapeHtml(group.name)}»">›</summary>
                      <div class="doka-actions-menu" role="menu">
                        ${orderControlHtml({
                          kind: 'group',
                          domain: domainId,
                          group: group.id || '',
                          order: group.order,
                          label: `Порядок группы «${group.name}»`,
                        })}
                        ${allowRename ? '<button type="button" class="doka-actions-item" data-action="rename">Переименовать</button>' : ''}
                        <button type="button" class="doka-actions-item doka-actions-item--danger" data-action="delete">Удалить</button>
                      </div>
                    </details>
                  </span>`
                : '';

              const isWide = topics.length >= WIDE_GROUP_MIN_TOPICS;
              return `
                <section class="group-section${isWide ? ' is-wide' : ''}" id="group-${escapeHtml(group.id || '')}">
                  <div class="group-header">
                    <span class="group-name">${escapeHtml(group.name)}</span>
                    ${groupTools}
                  </div>
                  <div class="topics-columns">
                    ${topicsHtml}
                    ${addTopic}
                  </div>
                </section>`;
            })
            .join('');

          const addGroup = adminAvailable
            ? `<div class="group-section doka-add-group">
                 <button type="button" class="doka-add-group-btn doka-add-btn">+ группа</button>
               </div>`
            : '';

          if (groups.length) {
            container.innerHTML = groupsHtml + addGroup;
          } else if (adminAvailable) {
            container.innerHTML =
              '<p style="color: var(--text-muted);">В этой области пока нет групп. Создайте первую группу.</p>' +
              addGroup;
          } else {
            container.innerHTML =
              '<p style="color: var(--text-muted);">В этой области пока нет тем.</p>';
          }

          function applyReadStates() {
            if (!window.DokaProgress) return;
            container
              .querySelectorAll('.topic-link[data-topic-url]')
              .forEach((link) => {
                link.classList.toggle(
                  'is-unread',
                  !window.DokaProgress.isRead(link.dataset.topicUrl)
                );
              });
          }

          applyReadStates();

          if (window.DokaProgress) {
            window.addEventListener(
              window.DokaProgress.changeEvent,
              applyReadStates
            );
            window.addEventListener('storage', (event) => {
              if (!event.key || event.key === window.DokaProgress.key) {
                applyReadStates();
              }
            });
          }

          function highlightGroupFromHash() {
            let raw = window.location.hash.slice(1);
            if (!raw) return;

            try {
              raw = decodeURIComponent(raw);
            } catch (_) {
              /* оставляем как есть */
            }
            if (!raw.startsWith('group-')) return;

            const target = document.getElementById(raw);
            if (!target) return;

            window.setTimeout(() => {
              target.scrollIntoView({ behavior: 'smooth', block: 'center' });
              target.classList.remove('active-flash');
              void target.offsetHeight;
              target.classList.add('active-flash');
              target.addEventListener(
                'animationend',
                () => target.classList.remove('active-flash'),
                { once: true }
              );
            }, 120);
          }

          highlightGroupFromHash();
          window.addEventListener('hashchange', highlightGroupFromHash);

          if (adminAvailable && window.DokaAdmin) {
            window.DokaAdmin.bindDomainPage(
              domainId,
              groups.map((group) => ({ id: group.id, name: group.name })),
              { localOnly: Boolean(domain.localOnly) }
            );
          }
        } catch (err) {
          console.error('[domain] Не удалось загрузить structure.json:', err);
          document.getElementById('groupsContainer').innerHTML =
            '<p style="color: var(--text-muted);">Не удалось загрузить структуру.</p>';
        }
      }

      loadDomain();

      // Если тему создали/переименовали в другой вкладке админки,
      // обновляем список автоматически, без ручного F5.
      if (window.DokaAdmin && typeof window.DokaAdmin.onStructureChange === 'function') {
        window.DokaAdmin.onStructureChange(() => window.location.reload());
      }
    })();
  </script>
</body>
</html>
