<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Дока ИСИП</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">
<link rel="stylesheet" href="./css/style.css?v=20261115-4">
  <link rel="stylesheet" href="./css/admin.css?v=20261109-15">
  <style>:root { --domain-accent: #614fa8; }</style>
</head>
<body>
  <header class="site-header">
    <div class="header-left">
      <a href="index.html" class="brand-badge">U•ᴥ•U Дока ИСИП</a>
      <div class="breadcrumbs">
        <span>/</span>
        <span class="current" id="headerBreadcrumb">...</span>
      </div>
    </div>
    <div class="header-right">
      <button class="search-trigger-btn" id="searchTriggerBtn">Поиск <kbd>/</kbd></button>
    </div>
  </header>

  <div class="domain-layout">
    <aside class="domain-sidebar">
      <div class="route-rail-kicker" id="domainKicker">Маршрут</div>
      <h1 id="domainTitle">...</h1>
      <p id="domainDesc">...</p>

      <div class="route-overall">
        <div class="route-overall-top">
          <span>Прогресс</span>
          <span><b id="overallDone">0</b> / <span id="overallTotal">0</span></span>
        </div>
        <div class="route-bar"><span id="overallBar"></span></div>
      </div>

      <details class="route-map-details" id="routeMapDetails">
        <summary class="route-map-summary">
          <span>Карта глав</span>
          <span class="route-map-summary-count" id="routeMapSummaryCount">0</span>
        </summary>
        <nav class="route-map" id="routeMap" aria-label="Карта маршрута"></nav>
      </details>
    </aside>

    <main class="domain-content">
      <div class="route-hero">
        <div>
          <div class="route-hero-kicker">Учебный маршрут</div>
          <h2>Путь от начала до конца</h2>
          <p id="routeHeroText"></p>
        </div>
        <a class="route-continue" id="continueLink" href="#">
          <span>▶</span>
          <span id="continueLabel">Продолжить</span>
        </a>
      </div>

      <div class="route" id="groupsContainer">
        <!-- Главы и темы строятся скриптом -->
      </div>
    </main>
  </div>

  <div class="search-modal" id="searchModal">
    <div class="search-box">
      <input type="text" class="search-box-input" id="searchInput" placeholder="Поиск по доке..." autocomplete="off">
      <ul class="search-results-list" id="searchResults"></ul>
    </div>
  </div>

  <script src="./js/search.js?v=20261114-1"></script>
  <script src="./js/progress.js?v=20261109-1"></script>
  <script src="./js/admin.js?v=20261115-1"></script>
  <script src="./js/admin-stats.js?v=20261109-7"></script>
  <script src="./js/mascot.js?v=20261109-7"></script>
  <script src="./js/perf.js?v=20261114-2"></script>
  <script>
    (function () {
      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function pad2(value) {
        return String(value).padStart(2, '0');
      }

      function pluralTopics(count) {
        const mod10 = count % 10;
        const mod100 = count % 100;
        if (mod10 === 1 && mod100 !== 11) return 'тема';
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) {
          return 'темы';
        }
        return 'тем';
      }

      function pluralChapters(count) {
        const mod10 = count % 10;
        const mod100 = count % 100;
        if (mod10 === 1 && mod100 !== 11) return 'глава';
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) {
          return 'главы';
        }
        return 'глав';
      }

      function normalizeTitle(value) {
        return String(value == null ? '' : value)
          .trim()
          .replace(/\s+/g, ' ')
          .toLowerCase();
      }

      function orderControlHtml({ kind, domain, group, url, order, label }) {
        const attrs = [
          'type="number"',
          'class="doka-order-input"',
          'min="0"',
          'step="10"',
          `value="${Number(order ?? 0)}"`,
          `data-kind="${escapeHtml(kind)}"`,
          domain ? `data-domain="${escapeHtml(domain)}"` : '',
          group ? `data-group="${escapeHtml(group)}"` : '',
          url ? `data-url="${escapeHtml(url)}"` : '',
          `data-order="${Number(order ?? 0)}"`,
          `aria-label="${escapeHtml(label)}"`,
        ]
          .filter(Boolean)
          .join(' ');

        return `<div class="doka-actions-order">
          <button type="button" class="doka-order-step" data-step="-10" aria-label="Уменьшить порядок на 10">&lt;</button>
          <input ${attrs}>
          <button type="button" class="doka-order-step" data-step="10" aria-label="Увеличить порядок на 10">&gt;</button>
        </div>`;
      }

      async function loadDomain() {
        const params = new URLSearchParams(window.location.search);
        const domainId = params.get('id') || 'csharp';

        try {
          const res = await fetch('./data/structure.json');
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const domain = data[domainId];

          if (!domain) {
            document.body.innerHTML = '<h1 style="padding:40px;">Область не найдена</h1>';
            return;
          }

          // Применяем тему и акцент
          document.body.setAttribute('data-domain', domainId);
          document.documentElement.style.setProperty('--domain-accent', domain.accent || '#6c47ff');
          document.title = `${domain.title || domainId} — Дока ИСИП`;

          // Заполняем сайдбар и хедер
          document.getElementById('headerBreadcrumb').textContent = domain.title || domainId;
          document.getElementById('domainTitle').textContent = domain.title || domainId;
          document.getElementById('domainDesc').textContent = domain.description || '';
          document.getElementById('domainKicker').textContent =
            `${domain.title || domainId} · маршрут`;

          const groups = [...(domain.groups || [])].sort(
            (a, b) => (a.order ?? 0) - (b.order ?? 0)
          );
          const allowRename = !domain.localOnly;

          const adminAvailable = window.DokaAdmin
            ? await window.DokaAdmin.ready()
            : false;

          const container = document.getElementById('groupsContainer');
          const routeMap = document.getElementById('routeMap');

          const groupData = groups.map((group, index) => {
            const topics = [...(group.topics || [])].sort(
              (a, b) => (a.order ?? 0) - (b.order ?? 0)
            );
            return { group, topics, index };
          });

          const totalTopics = groupData.reduce(
            (sum, item) => sum + item.topics.length,
            0
          );

          document.getElementById('routeHeroText').textContent =
            `${groupData.length} ${pluralChapters(groupData.length)} · ` +
            `${totalTopics} ${pluralTopics(totalTopics)}. ` +
            'Иди по маршруту сверху вниз — каждая глава заканчивается итогом.';

          const mapHtml = groupData
            .map(({ group, topics, index }) => {
              const id = group.id || '';
              return `<a href="#group-${escapeHtml(id)}" class="route-map-item" data-map-group="${escapeHtml(id)}">
                <span class="route-map-num">${pad2(index + 1)}</span>
                <span class="route-map-name">${escapeHtml(group.name)}</span>
                <span class="route-map-count" title="Тем: ${topics.length}">${topics.length}</span>
              </a>`;
            })
            .join('');

          routeMap.innerHTML = mapHtml;

          // На телефоне карта глав сворачивается в «Карта глав», чтобы
          // не отодвигать маршрут на несколько экранов вниз.
          const mapDetails = document.getElementById('routeMapDetails');
          const mapSummaryCount = document.getElementById('routeMapSummaryCount');
          if (mapSummaryCount) {
            mapSummaryCount.textContent = String(groupData.length);
          }
          if (mapDetails && typeof window.matchMedia === 'function') {
            const mobileMapQuery = window.matchMedia('(max-width: 680px)');
            let lastMobileMap = mobileMapQuery.matches;
            mapDetails.open = !lastMobileMap;
            const syncMapDetails = () => {
              const isMobile = mobileMapQuery.matches;
              if (isMobile === lastMobileMap) return;
              lastMobileMap = isMobile;
              mapDetails.open = !isMobile;
            };
            if (typeof mobileMapQuery.addEventListener === 'function') {
              mobileMapQuery.addEventListener('change', syncMapDetails);
            } else if (typeof mobileMapQuery.addListener === 'function') {
              mobileMapQuery.addListener(syncMapDetails);
            }
            // Страховка для браузеров, где change у matchMedia не срабатывает
            // при изменении ширины iframe/окна.
            window.addEventListener('resize', syncMapDetails);
          }

          const groupsHtml = groupData
            .map(({ group, topics, index }) => {
              const chapterNo = pad2(index + 1);

              const topicsHtml = topics
                .map((t, topicIndex) => {
                  const href = t.type === 'md'
                    ? `theme.html?path=${encodeURIComponent(t.url)}`
                    : escapeHtml(t.url);
                  const badge = t.interactive ? ' 🔧' : '';
                  const isSummary =
                    normalizeTitle(t.title) === normalizeTitle(group.name);
                  const isPractice =
                    !isSummary && /^Практик/i.test(String(t.title || '').trim());
                  const badges = [
                    isSummary
                      ? '<span class="route-badge route-badge--summary">Итог</span>'
                      : '',
                    isPractice
                      ? '<span class="route-badge">Практика</span>'
                      : '',
                  ].join('');
                  const actions = adminAvailable
                    ? `<details class="doka-actions"
                        data-kind="topic"
                        data-path="${escapeHtml(t.url)}"
                        data-title="${escapeHtml(t.title)}"
                        data-group="${escapeHtml(group.id || '')}"
                        data-order="${Number(t.order ?? 0)}">
                        <summary class="doka-actions-toggle" aria-haspopup="menu"
                          title="Действия с темой"
                          aria-label="Действия с темой «${escapeHtml(t.title)}»">›</summary>
                        <template class="doka-actions-template">
                        <div class="doka-actions-menu" role="menu">
                          ${orderControlHtml({
                            kind: 'topic',
                            domain: domainId,
                            group: group.id || '',
                            url: t.url,
                            order: t.order,
                            label: `Порядок темы «${t.title}»`,
                          })}
                          <button type="button" class="doka-actions-item" data-action="edit">Редактировать</button>
                          ${allowRename ? '<button type="button" class="doka-actions-item" data-action="rename">Переименовать</button>' : ''}
                          <button type="button" class="doka-actions-item" data-action="move">Переместить</button>
                          <button type="button" class="doka-actions-item doka-actions-item--danger" data-action="delete">Удалить</button>
                        </div>
                        </template>
                      </details>`
                    : '';

                  return `<div class="topic-row route-step${isSummary ? ' is-summary' : ''}" data-topic-url="${escapeHtml(t.url)}">
                    <a class="topic-link route-step-link" data-topic-url="${escapeHtml(t.url)}" href="${href}">
                      <span class="route-step-num">${chapterNo}.${pad2(topicIndex + 1)}</span>
                      <span class="route-step-title">${escapeHtml(t.title)}${badge}</span>
                      <span class="route-step-badges">${badges}</span>
                    </a>
                    ${actions}
                  </div>`;
                })
                .join('');

              const addTopic = adminAvailable
                ? `<button type="button" class="doka-add-topic" data-group="${escapeHtml(group.id || '')}">+ тема</button>`
                : '';

              const groupTools = adminAvailable
                ? `<span class="doka-group-tools">
                    <details class="doka-actions"
                      data-kind="group"
                      data-group="${escapeHtml(group.id || '')}"
                      data-title="${escapeHtml(group.name)}"
                      data-order="${Number(group.order ?? 0)}">
                      <summary class="doka-actions-toggle" aria-haspopup="menu"
                        title="Действия с группой"
                        aria-label="Действия с группой «${escapeHtml(group.name)}»">›</summary>
                      <template class="doka-actions-template">
                      <div class="doka-actions-menu" role="menu">
                        ${orderControlHtml({
                          kind: 'group',
                          domain: domainId,
                          group: group.id || '',
                          order: group.order,
                          label: `Порядок группы «${group.name}»`,
                        })}
                        ${allowRename ? '<button type="button" class="doka-actions-item" data-action="rename">Переименовать</button>' : ''}
                        <button type="button" class="doka-actions-item doka-actions-item--danger" data-action="delete">Удалить</button>
                      </div>
                      </template>
                    </details>
                  </span>`
                : '';

              return `<section class="group-section route-chapter" id="group-${escapeHtml(group.id || '')}"
                data-group-id="${escapeHtml(group.id || '')}"
                data-group-name="${escapeHtml(group.name)}"
                data-chapter-index="${index + 1}"
                data-total="${topics.length}">
                <div class="route-node">${chapterNo}</div>
                <div class="route-card">
                  <header class="group-header route-card-head">
                    <div class="route-card-heading">
                      <div class="route-card-kicker">Глава ${chapterNo} · ${topics.length} ${pluralTopics(topics.length)}</div>
                      <span class="group-name">${escapeHtml(group.name)}</span>
                    </div>
                    <div class="route-card-side">
                      <div class="route-card-progress" title="Пройдено 0 из ${topics.length}">
                        <span class="route-card-count">0 / ${topics.length}</span>
                        <i><b style="width:0%"></b></i>
                      </div>
                      ${groupTools}
                    </div>
                  </header>
                  <div class="topics-columns route-steps">
                    ${topicsHtml}
                    ${addTopic}
                  </div>
                </div>
              </section>`;
            })
            .join('');

          const addGroup = adminAvailable
            ? `<div class="group-section doka-add-group">
                 <button type="button" class="doka-add-group-btn doka-add-btn">+ группа</button>
               </div>`
            : '';

          const startHtml = groupData.length
            ? '<div class="route-start">старт</div>'
            : '';

          const finishHtml = groupData.length
            ? `<div class="route-finish" id="routeFinish">
                 <div class="route-finish-node">⚑</div>
                 <div class="route-finish-card">
                   <h3>Финиш маршрута</h3>
                   <p id="finishText"></p>
                   <a id="finishLink" href="#">Продолжить →</a>
                 </div>
               </div>`
            : '';

          container.classList.toggle('is-empty', !groupData.length);

          if (groupData.length) {
            container.innerHTML =
              startHtml + groupsHtml + addGroup + finishHtml;
          } else if (adminAvailable) {
            container.innerHTML =
              '<p class="route-empty">В этой области пока нет групп. Создайте первую группу.</p>' +
              addGroup;
          } else {
            container.innerHTML =
              '<p class="route-empty">В этой области пока нет тем.</p>';
          }

          let scrollSpyActive = false;

          function setActiveMap(groupId) {
            if (!groupId) return;
            document
              .querySelectorAll('.route-map-item[data-map-group]')
              .forEach((item) => {
                item.classList.toggle(
                  'is-active',
                  item.dataset.mapGroup === groupId
                );
              });
          }

          function currentReadSet() {
            if (!window.DokaProgress) return null;
            try {
              return new Set(window.DokaProgress.getRead());
            } catch (_) {
              return new Set();
            }
          }

          function isUrlRead(url, readSet) {
            if (!readSet) return true;
            const key = window.DokaProgress.normalize(url);
            return Boolean(key) && readSet.has(key);
          }

          function updateContinue(currentRow) {
            const link = document.getElementById('continueLink');
            const label = document.getElementById('continueLabel');
            if (!link || !label) return;

            const topicLink = currentRow
              ? currentRow.querySelector('.route-step-link')
              : null;

            if (topicLink) {
              link.href = topicLink.getAttribute('href') || '#';
              label.textContent = 'Продолжить';
              link.classList.remove('is-complete');
            } else {
              link.href = '#routeFinish';
              label.textContent = 'Всё пройдено';
              link.classList.add('is-complete');
            }
          }

          function updateFinish(currentRow, doneTotal, total) {
            const text = document.getElementById('finishText');
            const link = document.getElementById('finishLink');
            if (!text || !link) return;

            const firstLink = container.querySelector('.route-step-link');
            const currentLink = currentRow
              ? currentRow.querySelector('.route-step-link')
              : null;

            if (total && doneTotal === total) {
              text.textContent =
                `Маршрут пройден: ${doneTotal} из ${total} тем. ` +
                'Можно возвращаться к любому итогу главы.';
              link.textContent = 'Вернуться к началу →';
              link.href = firstLink ? firstLink.getAttribute('href') : '#';
            } else {
              text.textContent =
                `Пройдено ${doneTotal} из ${total} тем. ` +
                `Осталось ${Math.max(0, total - doneTotal)}.`;
              link.textContent = 'Продолжить →';
              link.href = currentLink
                ? currentLink.getAttribute('href')
                : firstLink
                  ? firstLink.getAttribute('href')
                  : '#';
            }
          }

          function updateProgressUI() {
            const readSet = currentReadSet();
            const rows = [
              ...container.querySelectorAll('.topic-row[data-topic-url]'),
            ];
            let total = 0;
            let doneTotal = 0;
            let currentRow = null;

            rows.forEach((row) => {
              const done = isUrlRead(row.dataset.topicUrl, readSet);
              total += 1;
              if (done) doneTotal += 1;

              row.classList.toggle('is-done', done);
              row.classList.remove('is-current');

              const badges = row.querySelector('.route-step-badges');
              if (badges) {
                badges
                  .querySelectorAll('.route-now-badge')
                  .forEach((element) => element.remove());
              }

              if (!done && !currentRow) currentRow = row;
            });

            if (currentRow) {
              currentRow.classList.add('is-current');
              const badges = currentRow.querySelector('.route-step-badges');
              if (badges) {
                const now = document.createElement('span');
                now.className = 'route-badge route-badge--now route-now-badge';
                now.textContent = 'сейчас';
                badges.appendChild(now);
              }
            }

            const currentChapterId = currentRow
              ? currentRow.closest('.route-chapter')?.dataset.groupId || ''
              : '';

            const chapters = [
              ...container.querySelectorAll('.route-chapter'),
            ];
            const chapterStats = new Map();

            chapters.forEach((chapter) => {
              const chapterRows = [
                ...chapter.querySelectorAll('.topic-row[data-topic-url]'),
              ];
              const totalC = chapterRows.length;
              let doneC = 0;

              chapterRows.forEach((row) => {
                if (isUrlRead(row.dataset.topicUrl, readSet)) doneC += 1;
              });

              const groupId = chapter.dataset.groupId || '';
              chapterStats.set(groupId, { done: doneC, total: totalC });

              const isDone = totalC > 0 && doneC === totalC;
              chapter.classList.toggle('is-done', isDone);
              chapter.classList.toggle(
                'is-active',
                groupId === currentChapterId
              );

              const node = chapter.querySelector('.route-node');
              if (node) {
                node.textContent = isDone
                  ? '✓'
                  : pad2(Number(chapter.dataset.chapterIndex) || 0);
              }

              const count = chapter.querySelector('.route-card-count');
              if (count) count.textContent = `${doneC} / ${totalC}`;

              const bar = chapter.querySelector('.route-card-progress b');
              if (bar) {
                bar.style.width = totalC
                  ? `${Math.round((doneC / totalC) * 100)}%`
                  : '0%';
              }

              const progress = chapter.querySelector('.route-card-progress');
              if (progress) {
                progress.title = `Пройдено ${doneC} из ${totalC}`;
              }
            });

            const mapItems = [
              ...document.querySelectorAll(
                '.route-map-item[data-map-group]'
              ),
            ];

            mapItems.forEach((item, index) => {
              const groupId = item.dataset.mapGroup || '';
              const stats = chapterStats.get(groupId) || {
                done: 0,
                total: 0,
              };
              const isDone = stats.total > 0 && stats.done === stats.total;

              item.classList.toggle('is-done', isDone);

              const num = item.querySelector('.route-map-num');
              if (num) num.textContent = isDone ? '✓' : pad2(index + 1);

              const count = item.querySelector('.route-map-count');
              if (count) {
                count.textContent = String(stats.total);
                count.title = `Пройдено ${stats.done} из ${stats.total}`;
              }
            });

            const overallDone = document.getElementById('overallDone');
            if (overallDone) overallDone.textContent = String(doneTotal);

            const overallTotal = document.getElementById('overallTotal');
            if (overallTotal) overallTotal.textContent = String(total);

            const overallBar = document.getElementById('overallBar');
            if (overallBar) {
              overallBar.style.width = total
                ? `${(doneTotal / total) * 100}%`
                : '0%';
            }

            container.style.setProperty(
              '--route-progress',
              total ? `${(doneTotal / total) * 100}%` : '0%'
            );

            updateContinue(currentRow);
            updateFinish(currentRow, doneTotal, total);

            if (!scrollSpyActive) setActiveMap(currentChapterId);
          }

          function rebuildMap() {
            const chapters = [
              ...container.querySelectorAll('.route-chapter'),
            ];
            routeMap.innerHTML = chapters
              .map((chapter, index) => {
                const id = chapter.dataset.groupId || '';
                const name = chapter.dataset.groupName || '';
                const total = chapter.dataset.total || '0';
                return `<a href="#group-${escapeHtml(id)}" class="route-map-item" data-map-group="${escapeHtml(id)}">
                  <span class="route-map-num">${pad2(index + 1)}</span>
                  <span class="route-map-name">${escapeHtml(name)}</span>
                  <span class="route-map-count" title="Тем: ${escapeHtml(total)}">${escapeHtml(total)}</span>
                </a>`;
              })
              .join('');
          }

          // Порядок мог измениться через админку без перезагрузки страницы:
          // пересобираем номера глав, тем и карту маршрута.
          function refreshRouteOrder() {
            const chapters = [
              ...container.querySelectorAll('.route-chapter'),
            ];
            chapters.forEach((chapter, index) => {
              const chapterNo = pad2(index + 1);
              const rows = [
                ...chapter.querySelectorAll('.topic-row[data-topic-url]'),
              ];

              chapter.dataset.chapterIndex = String(index + 1);
              chapter.dataset.total = String(rows.length);

              const kicker = chapter.querySelector('.route-card-kicker');
              if (kicker) {
                kicker.textContent =
                  `Глава ${chapterNo} · ${rows.length} ${pluralTopics(rows.length)}`;
              }

              rows.forEach((row, rowIndex) => {
                const num = row.querySelector('.route-step-num');
                if (num) num.textContent = `${chapterNo}.${pad2(rowIndex + 1)}`;
              });

              const node = chapter.querySelector('.route-node');
              if (node && !chapter.classList.contains('is-done')) {
                node.textContent = chapterNo;
              }
            });

            scrollSpyActive = false;
            rebuildMap();
            updateProgressUI();
          }

          function setupScrollSpy() {
            if (!('IntersectionObserver' in window)) return;
            const chapters = [
              ...container.querySelectorAll('.route-chapter'),
            ];
            if (!chapters.length) return;

            const observer = new IntersectionObserver(
              (entries) => {
                const visible = entries.filter(
                  (entry) => entry.isIntersecting
                );
                if (!visible.length) return;
                scrollSpyActive = true;
                setActiveMap(visible[0].target.dataset.groupId || '');
              },
              { rootMargin: '-45% 0px -50% 0px', threshold: 0 }
            );

            chapters.forEach((chapter) => observer.observe(chapter));
          }

          updateProgressUI();
          setupScrollSpy();

          // Меню действий собираем лениво, при первом открытии: в области «csharp»
          // 99 тем, и если положить 99 <input type=number> прямо в разметку, то
          // Edge на каждое нажатие клавиши в любом поле пересканирует все поля
          // страницы (это его автозаполнение), а с многоколоночной раскладкой
          // (.topics-columns) такое сканирование стоит ~400 мс на символ —
          // отсюда и фриз при наборе в поиске. Шаблон лежит в <template> и в
          // документе не виден, поэтому ничего не тормозит.
          function buildActionsMenu(node) {
            const details = node && node.closest
              ? node.closest('details.doka-actions')
              : null;
            if (!details) return;
            if (details.querySelector('.doka-actions-menu')) return;
            const template = details.querySelector('template.doka-actions-template');
            if (!template) return;
            const fragment = template.content.cloneNode(true);
            // В локальном режиме кнопок переименования быть не должно: раньше
            // их вырезал bindDomainPage по живой разметке, но ленивое меню
            // появляется позже — чистим шаблон сами.
            if (domain.localOnly) {
              fragment
                .querySelectorAll('.doka-actions-item[data-action="rename"]')
                .forEach((button) => button.remove());
            }
            details.appendChild(fragment);
          }

          container.addEventListener('click', (event) =>
            buildActionsMenu(event.target)
          );
          container.addEventListener('focusin', (event) =>
            buildActionsMenu(event.target)
          );
          // Собранное меню держим в документе только пока оно открыто:
          // иначе 99 открытых за сессию полей снова начнут тормозить ввод.
          container.addEventListener(
            'toggle',
            (event) => {
              const details = event.target;
              if (!details.matches || !details.matches('details.doka-actions')) return;
              if (details.open) return;
              const menu = details.querySelector('.doka-actions-menu');
              if (menu) menu.remove();
            },
            true
          );

          if (window.DokaProgress) {
            window.addEventListener(
              window.DokaProgress.changeEvent,
              updateProgressUI
            );
            window.addEventListener('storage', (event) => {
              if (!event.key || event.key === window.DokaProgress.key) {
                updateProgressUI();
              }
            });
          }

          // Возврат со страницы темы через «назад» может отдать страницу
          // из bfcache — прогресс к этому моменту уже изменился.
          window.addEventListener('pageshow', (event) => {
            if (event.persisted) updateProgressUI();
          });

          window.addEventListener('doka-order-changed', refreshRouteOrder);

          function highlightGroupFromHash() {
            let raw = window.location.hash.slice(1);
            if (!raw) return;

            try {
              raw = decodeURIComponent(raw);
            } catch (_) {
              /* оставляем как есть */
            }
            if (!raw.startsWith('group-')) return;

            const target = document.getElementById(raw);
            if (!target) return;

            window.setTimeout(() => {
              target.scrollIntoView({ behavior: 'smooth', block: 'center' });
              target.classList.remove('active-flash');
              void target.offsetHeight;
              target.classList.add('active-flash');
              target.addEventListener(
                'animationend',
                () => target.classList.remove('active-flash'),
                { once: true }
              );
            }, 120);
          }

          highlightGroupFromHash();
          window.addEventListener('hashchange', highlightGroupFromHash);

          if (adminAvailable && window.DokaAdmin) {
            window.DokaAdmin.bindDomainPage(
              domainId,
              groups.map((group) => ({ id: group.id, name: group.name })),
              { localOnly: Boolean(domain.localOnly) }
            );
          }
        } catch (err) {
          console.error('[domain] Не удалось загрузить structure.json:', err);
          document.getElementById('groupsContainer').innerHTML =
            '<p class="route-empty">Не удалось загрузить структуру.</p>';
        }
      }

      loadDomain();

      // Если тему создали/переименовали в другой вкладке админки,
      // обновляем список автоматически, без ручного F5.
      if (window.DokaAdmin && typeof window.DokaAdmin.onStructureChange === 'function') {
        window.DokaAdmin.onStructureChange(() => window.location.reload());
      }
    })();
  </script>
</body>
</html>
