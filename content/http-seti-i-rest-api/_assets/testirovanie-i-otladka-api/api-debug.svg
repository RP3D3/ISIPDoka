<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Тестирование и отладка API</title>
  <desc id="desc">Схема показывает curl, Postman, DevTools, контрактные тесты и граничные случаи.</desc>
  <rect width="920" height="500" fill="#f5fbfb"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14343a">Как проверить API</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#14343a">
    <rect x="30" y="95" width="200" height="110" rx="12" fill="#e6fbfb" stroke="#00b8b9" stroke-width="2"/>
    <text x="130" y="127" text-anchor="middle" font-weight="700">curl</text>
    <text x="130" y="152" text-anchor="middle" font-size="12">быстрый запрос</text>
    <text x="130" y="174" text-anchor="middle" font-size="12">из терминала</text>
    <text x="130" y="196" text-anchor="middle" font-size="12">заголовки и тело</text>

    <rect x="255" y="95" width="200" height="110" rx="12" fill="#fff7d6" stroke="#eab308" stroke-width="2"/>
    <text x="355" y="127" text-anchor="middle" font-weight="700">Postman</text>
    <text x="355" y="152" text-anchor="middle" font-size="12">коллекции</text>
    <text x="355" y="174" text-anchor="middle" font-size="12">окружения</text>
    <text x="355" y="196" text-anchor="middle" font-size="12">повторяемые сценарии</text>

    <rect x="480" y="95" width="200" height="110" rx="12" fill="#e9f8ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="580" y="127" text-anchor="middle" font-weight="700">DevTools</text>
    <text x="580" y="152" text-anchor="middle" font-size="12">Network</text>
    <text x="580" y="174" text-anchor="middle" font-size="12">заголовки, тело,</text>
    <text x="580" y="196" text-anchor="middle" font-size="12">время и статус</text>

    <rect x="705" y="95" width="185" height="110" rx="12" fill="#ffe8e8" stroke="#ef4444" stroke-width="2"/>
    <text x="797" y="127" text-anchor="middle" font-weight="700">Тесты</text>
    <text x="797" y="152" text-anchor="middle" font-size="12">контракт</text>
    <text x="797" y="174" text-anchor="middle" font-size="12">ошибки</text>
    <text x="797" y="196" text-anchor="middle" font-size="12">граничные случаи</text>

    <rect x="90" y="270" width="740" height="160" rx="12" fill="#ffffff" stroke="#00b8b9" stroke-width="2"/>
    <text x="460" y="302" text-anchor="middle" font-weight="700">Минимальный набор проверок</text>
    <text x="120" y="334" font-size="13">• успешный запрос;</text>
    <text x="120" y="358" font-size="13">• неверный ввод;</text>
    <text x="120" y="382" font-size="13">• нет авторизации;</text>
    <text x="120" y="406" font-size="13">• чужой ресурс;</text>
    <text x="520" y="334" font-size="13">• несуществующий ID;</text>
    <text x="520" y="358" font-size="13">• повторный запрос;</text>
    <text x="520" y="382" font-size="13">• лимит запросов;</text>
    <text x="520" y="406" font-size="13">• формат ошибки.</text>
  </g>
</svg>
