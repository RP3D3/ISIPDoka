<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Клиент API: fetch, статус и ошибки</title>
  <desc id="desc">Схема показывает путь ответа от API через fetch к обработке данных и ошибок.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00b8b9"/>
    </marker>
  </defs>
  <rect width="920" height="500" fill="#f5fbfb"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14343a">Что делает клиент с ответом</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#14343a">
    <rect x="30" y="100" width="180" height="100" rx="12" fill="#e6fbfb" stroke="#00b8b9" stroke-width="2"/>
    <text x="120" y="134" text-anchor="middle" font-weight="700">fetch</text>
    <text x="120" y="158" text-anchor="middle" font-size="12">метод, URL,</text>
    <text x="120" y="180" text-anchor="middle" font-size="12">заголовки, тело</text>

    <rect x="250" y="100" width="190" height="100" rx="12" fill="#fff7d6" stroke="#eab308" stroke-width="2"/>
    <text x="345" y="134" text-anchor="middle" font-weight="700">Ответ</text>
    <text x="345" y="158" text-anchor="middle" font-size="12">status, headers,</text>
    <text x="345" y="180" text-anchor="middle" font-size="12">body</text>

    <rect x="480" y="100" width="190" height="100" rx="12" fill="#e9f8ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="575" y="134" text-anchor="middle" font-weight="700">Проверка</text>
    <text x="575" y="158" text-anchor="middle" font-size="12">response.ok</text>
    <text x="575" y="180" text-anchor="middle" font-size="12">разбор JSON</text>

    <rect x="710" y="100" width="180" height="100" rx="12" fill="#ffe8e8" stroke="#ef4444" stroke-width="2"/>
    <text x="800" y="134" text-anchor="middle" font-weight="700">Ошибка</text>
    <text x="800" y="158" text-anchor="middle" font-size="12">код, сообщение,</text>
    <text x="800" y="180" text-anchor="middle" font-size="12">поля</text>

    <line x1="210" y1="150" x2="240" y2="150" stroke="#00b8b9" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="440" y1="150" x2="470" y2="150" stroke="#00b8b9" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="670" y1="150" x2="700" y2="150" stroke="#00b8b9" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="90" y="280" width="740" height="150" rx="12" fill="#ffffff" stroke="#00b8b9" stroke-width="2"/>
    <text x="460" y="312" text-anchor="middle" font-weight="700">Что нельзя забыть</text>
    <text x="120" y="344" font-size="13">• проверять `response.ok`;</text>
    <text x="120" y="368" font-size="13">• читать тело ошибки;</text>
    <text x="120" y="392" font-size="13">• ставить таймаут;</text>
    <text x="520" y="344" font-size="13">• отменять лишние запросы;</text>
    <text x="520" y="368" font-size="13">• не хранить токен в открытом виде;</text>
    <text x="520" y="392" font-size="13">• показывать понятный текст.</text>
  </g>
</svg>
