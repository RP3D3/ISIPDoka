<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Контракт REST API</title>
  <desc id="desc">Схема показывает ресурсы, методы, статус-коды, ошибки и версии API.</desc>
  <rect width="920" height="500" fill="#f5fbfb"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14343a">REST API — это контракт</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#14343a">
    <rect x="30" y="95" width="200" height="120" rx="12" fill="#e6fbfb" stroke="#00b8b9" stroke-width="2"/>
    <text x="130" y="127" text-anchor="middle" font-weight="700">Ресурсы</text>
    <text x="130" y="152" text-anchor="middle" font-size="12">/users</text>
    <text x="130" y="174" text-anchor="middle" font-size="12">/users/42/tasks</text>
    <text x="130" y="196" text-anchor="middle" font-size="12">существительные</text>

    <rect x="255" y="95" width="200" height="120" rx="12" fill="#fff7d6" stroke="#eab308" stroke-width="2"/>
    <text x="355" y="127" text-anchor="middle" font-weight="700">Методы</text>
    <text x="355" y="152" text-anchor="middle" font-size="12">GET, POST</text>
    <text x="355" y="174" text-anchor="middle" font-size="12">PATCH, DELETE</text>
    <text x="355" y="196" text-anchor="middle" font-size="12">действие в методе</text>

    <rect x="480" y="95" width="200" height="120" rx="12" fill="#e9f8ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="580" y="127" text-anchor="middle" font-weight="700">Статусы</text>
    <text x="580" y="152" text-anchor="middle" font-size="12">200, 201, 204</text>
    <text x="580" y="174" text-anchor="middle" font-size="12">400, 401, 403</text>
    <text x="580" y="196" text-anchor="middle" font-size="12">404, 422, 500</text>

    <rect x="705" y="95" width="185" height="120" rx="12" fill="#ffe8e8" stroke="#ef4444" stroke-width="2"/>
    <text x="797" y="127" text-anchor="middle" font-weight="700">Ошибки</text>
    <text x="797" y="152" text-anchor="middle" font-size="12">код</text>
    <text x="797" y="174" text-anchor="middle" font-size="12">сообщение</text>
    <text x="797" y="196" text-anchor="middle" font-size="12">поля</text>

    <rect x="120" y="275" width="680" height="150" rx="12" fill="#ffffff" stroke="#00b8b9" stroke-width="2"/>
    <text x="460" y="307" text-anchor="middle" font-weight="700">Что фиксируется в контракте</text>
    <text x="150" y="339" font-size="13">• пути и методы;</text>
    <text x="150" y="363" font-size="13">• формат запроса и ответа;</text>
    <text x="150" y="387" font-size="13">• коды ошибок;</text>
    <text x="520" y="339" font-size="13">• пагинация и фильтры;</text>
    <text x="520" y="363" font-size="13">• версия API;</text>
    <text x="520" y="387" font-size="13">• примеры запросов.</text>
  </g>
</svg>
