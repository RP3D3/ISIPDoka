<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Auth, CORS и лимиты API</title>
  <desc id="desc">Схема показывает аутентификацию, CORS и ограничение частоты запросов.</desc>
  <rect width="920" height="500" fill="#f5fbfb"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14343a">Кто ты, откуда и как часто</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#14343a">
    <rect x="30" y="95" width="270" height="150" rx="12" fill="#e6fbfb" stroke="#00b8b9" stroke-width="2"/>
    <text x="165" y="127" text-anchor="middle" font-weight="700">Аутентификация</text>
    <text x="165" y="152" text-anchor="middle" font-size="12">сессия или токен</text>
    <text x="165" y="174" text-anchor="middle" font-size="12">API key, JWT, OAuth2</text>
    <text x="165" y="196" text-anchor="middle" font-size="12">кто пользователь</text>
    <text x="165" y="218" text-anchor="middle" font-size="12">401, если не вошёл</text>

    <rect x="325" y="95" width="270" height="150" rx="12" fill="#fff7d6" stroke="#eab308" stroke-width="2"/>
    <text x="460" y="127" text-anchor="middle" font-weight="700">Авторизация</text>
    <text x="460" y="152" text-anchor="middle" font-size="12">роли и scopes</text>
    <text x="460" y="174" text-anchor="middle" font-size="12">что разрешено</text>
    <text x="460" y="196" text-anchor="middle" font-size="12">проверка владельца</text>
    <text x="460" y="218" text-anchor="middle" font-size="12">403, если нельзя</text>

    <rect x="620" y="95" width="270" height="150" rx="12" fill="#ffe8e8" stroke="#ef4444" stroke-width="2"/>
    <text x="755" y="127" text-anchor="middle" font-weight="700">Лимиты</text>
    <text x="755" y="152" text-anchor="middle" font-size="12">rate limiting</text>
    <text x="755" y="174" text-anchor="middle" font-size="12">квоты и окна</text>
    <text x="755" y="196" text-anchor="middle" font-size="12">защита от перебора</text>
    <text x="755" y="218" text-anchor="middle" font-size="12">429 Too Many Requests</text>

    <rect x="90" y="290" width="740" height="140" rx="12" fill="#ffffff" stroke="#00b8b9" stroke-width="2"/>
    <text x="460" y="322" text-anchor="middle" font-weight="700">CORS: что браузер спросит у сервера</text>
    <text x="120" y="354" font-size="13">• с какого домена пришёл запрос;</text>
    <text x="120" y="378" font-size="13">• какие методы разрешены;</text>
    <text x="120" y="402" font-size="13">• можно ли отправлять cookies;</text>
    <text x="520" y="354" font-size="13">• какие заголовки разрешены;</text>
    <text x="520" y="378" font-size="13">• нужен ли preflight OPTIONS;</text>
    <text x="520" y="402" font-size="13">• не открыт ли доступ всем.</text>
  </g>
</svg>
