<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Контракт между фронтендом и PHP API</title>
  <desc id="desc">Схема показывает запрос фронтенда, JSON, статус-коды, CORS и ответ API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#f7f7ff"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#25234a">Договор между фронтендом и API</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#25234a">
    <rect x="25" y="110" width="190" height="110" rx="12" fill="#eef0ff" stroke="#818cf8" stroke-width="2"/>
    <text x="120" y="145" text-anchor="middle" font-weight="700">Фронтенд</text>
    <text x="120" y="170" text-anchor="middle" font-size="12">fetch или axios</text>
    <text x="120" y="192" text-anchor="middle" font-size="12">JSON, cookies</text>

    <rect x="250" y="110" width="190" height="110" rx="12" fill="#fff4cc" stroke="#eab308" stroke-width="2"/>
    <text x="345" y="145" text-anchor="middle" font-weight="700">HTTP</text>
    <text x="345" y="170" text-anchor="middle" font-size="12">метод, путь,</text>
    <text x="345" y="192" text-anchor="middle" font-size="12">заголовки</text>

    <rect x="475" y="110" width="190" height="110" rx="12" fill="#e8f7ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="570" y="145" text-anchor="middle" font-weight="700">PHP API</text>
    <text x="570" y="170" text-anchor="middle" font-size="12">routing,</text>
    <text x="570" y="192" text-anchor="middle" font-size="12">валидация</text>

    <rect x="700" y="110" width="190" height="110" rx="12" fill="#ffe3d6" stroke="#ff6b35" stroke-width="2"/>
    <text x="795" y="145" text-anchor="middle" font-weight="700">Ответ</text>
    <text x="795" y="170" text-anchor="middle" font-size="12">JSON + статус</text>
    <text x="795" y="192" text-anchor="middle" font-size="12">+ CORS</text>

    <line x1="215" y1="165" x2="240" y2="165" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="440" y1="165" x2="465" y2="165" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="665" y1="165" x2="690" y2="165" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="90" y="290" width="740" height="140" rx="12" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
    <text x="460" y="322" text-anchor="middle" font-weight="700">Что должно быть в контракте</text>
    <text x="120" y="354" font-size="13">• единый формат ошибки;</text>
    <text x="120" y="378" font-size="13">• понятные статус-коды;</text>
    <text x="120" y="402" font-size="13">• пагинация и фильтры;</text>
    <text x="520" y="354" font-size="13">• CORS только для нужных доменов;</text>
    <text x="520" y="378" font-size="13">• auth через cookie или токен;</text>
    <text x="520" y="402" font-size="13">• версия API и дата изменения.</text>
  </g>
</svg>
