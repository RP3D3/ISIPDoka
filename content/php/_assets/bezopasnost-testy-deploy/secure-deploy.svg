<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Безопасность, тесты и деплой PHP-бэкенда</title>
  <desc id="desc">Схема перечисляет защиту от XSS, CSRF и SQL-инъекций, тесты и деплой.</desc>
  <rect width="920" height="480" fill="#f7f7ff"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#25234a">Безопасность — часть обычной работы</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#25234a">
    <rect x="30" y="100" width="410" height="120" rx="12" fill="#ffe3d6" stroke="#ff6b35" stroke-width="2"/>
    <text x="50" y="132" font-weight="700">Угрозы</text>
    <text x="50" y="158" font-size="13">SQL-инъекции, XSS, CSRF,</text>
    <text x="50" y="180" font-size="13">слабые пароли, утечка секретов.</text>

    <rect x="480" y="100" width="410" height="120" rx="12" fill="#e8f7ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="500" y="132" font-weight="700">Защита</text>
    <text x="500" y="158" font-size="13">подготовленные запросы,</text>
    <text x="500" y="180" font-size="13">экранирование, CSRF-токены, хеши.</text>

    <rect x="30" y="250" width="410" height="110" rx="12" fill="#fff4cc" stroke="#eab308" stroke-width="2"/>
    <text x="50" y="282" font-weight="700">Тесты</text>
    <text x="50" y="308" font-size="13">PHPUnit: unit и интеграционные;</text>
    <text x="50" y="330" font-size="13">тестовая база и фикстуры.</text>

    <rect x="480" y="250" width="410" height="110" rx="12" fill="#eef0ff" stroke="#818cf8" stroke-width="2"/>
    <text x="500" y="282" font-weight="700">Деплой</text>
    <text x="500" y="308" font-size="13">Docker, переменные окружения,</text>
    <text x="500" y="330" font-size="13">логи, healthcheck, резервные копии.</text>

    <rect x="120" y="390" width="680" height="60" rx="10" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
    <text x="460" y="416" text-anchor="middle" font-weight="700">Правило: не показывать ошибки и секреты пользователю.</text>
    <text x="460" y="438" text-anchor="middle" font-size="12" fill="#5c4a20">Логи — для команды, ответ — для клиента.</text>
  </g>
</svg>
