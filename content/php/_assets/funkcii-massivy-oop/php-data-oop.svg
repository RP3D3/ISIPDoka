<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Данные, функции и ООП в PHP</title>
  <desc id="desc">Схема показывает массивы, строки, функции, классы и Composer.</desc>
  <rect width="920" height="500" fill="#f7f7ff"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#25234a">От данных к структуре проекта</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#25234a">
    <rect x="30" y="100" width="200" height="110" rx="12" fill="#eef0ff" stroke="#818cf8" stroke-width="2"/>
    <text x="130" y="134" text-anchor="middle" font-weight="700">Массивы</text>
    <text x="130" y="160" text-anchor="middle" font-size="12">списки и словари</text>
    <text x="130" y="182" text-anchor="middle" font-size="12">foreach, filter, map</text>

    <rect x="255" y="100" width="200" height="110" rx="12" fill="#e8f7ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="355" y="134" text-anchor="middle" font-weight="700">Строки</text>
    <text x="355" y="160" text-anchor="middle" font-size="12">интерполяция</text>
    <text x="355" y="182" text-anchor="middle" font-size="12">mbstring, sprintf</text>

    <rect x="480" y="100" width="200" height="110" rx="12" fill="#fff4cc" stroke="#eab308" stroke-width="2"/>
    <text x="580" y="134" text-anchor="middle" font-weight="700">Функции</text>
    <text x="580" y="160" text-anchor="middle" font-size="12">параметры, return</text>
    <text x="580" y="182" text-anchor="middle" font-size="12">замыкания</text>

    <rect x="705" y="100" width="185" height="110" rx="12" fill="#ffe3d6" stroke="#ff6b35" stroke-width="2"/>
    <text x="797" y="134" text-anchor="middle" font-weight="700">Классы</text>
    <text x="797" y="160" text-anchor="middle" font-size="12">объекты, интерфейсы</text>
    <text x="797" y="182" text-anchor="middle" font-size="12">трейты</text>

    <rect x="120" y="280" width="680" height="130" rx="12" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
    <text x="460" y="312" text-anchor="middle" font-weight="700">Composer и автозагрузка</text>
    <text x="150" y="344" font-size="13">• namespaces разделяют код по смыслу;</text>
    <text x="150" y="368" font-size="13">• PSR-4 связывает namespace и папки;</text>
    <text x="150" y="392" font-size="13">• зависимости ставятся через Composer.</text>
    <text x="530" y="344" font-size="13">• не смешивайте HTML и бизнес-логику;</text>
    <text x="530" y="368" font-size="13">• маленькие классы проще тестировать;</text>
    <text x="530" y="392" font-size="13">• структура важнее количества файлов.</text>

    <text x="460" y="456" text-anchor="middle" font-size="13" fill="#5c4a20">Сначала данные и функции, потом классы, потом фреймворк.</text>
  </g>
</svg>
