<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Поток запроса в Ларавел</title>
  <desc id="desc">Схема показывает путь от маршрута через контроллер и Eloquent к ответу.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#f7f7ff"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#25234a">Как Ларавел обрабатывает запрос</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#25234a">
    <rect x="25" y="110" width="170" height="100" rx="12" fill="#eef0ff" stroke="#818cf8" stroke-width="2"/>
    <text x="110" y="145" text-anchor="middle" font-weight="700">Route</text>
    <text x="110" y="170" text-anchor="middle" font-size="12">URL и метод</text>
    <text x="110" y="192" text-anchor="middle" font-size="12">routes/web.php</text>

    <rect x="230" y="110" width="180" height="100" rx="12" fill="#fff4cc" stroke="#eab308" stroke-width="2"/>
    <text x="320" y="145" text-anchor="middle" font-weight="700">Controller</text>
    <text x="320" y="170" text-anchor="middle" font-size="12">валидация,</text>
    <text x="320" y="192" text-anchor="middle" font-size="12">логика</text>

    <rect x="445" y="110" width="180" height="100" rx="12" fill="#e8f7ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="535" y="145" text-anchor="middle" font-weight="700">Model</text>
    <text x="535" y="170" text-anchor="middle" font-size="12">Eloquent,</text>
    <text x="535" y="192" text-anchor="middle" font-size="12">связи, запросы</text>

    <rect x="660" y="110" width="230" height="100" rx="12" fill="#ffe3d6" stroke="#ff6b35" stroke-width="2"/>
    <text x="775" y="145" text-anchor="middle" font-weight="700">View или JSON</text>
    <text x="775" y="170" text-anchor="middle" font-size="12">Blade, API Resource,</text>
    <text x="775" y="192" text-anchor="middle" font-size="12">статус-код</text>

    <line x1="195" y1="160" x2="220" y2="160" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="410" y1="160" x2="435" y2="160" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="625" y1="160" x2="650" y2="160" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="90" y="280" width="740" height="130" rx="12" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
    <text x="460" y="312" text-anchor="middle" font-weight="700">Что не забыть</text>
    <text x="120" y="344" font-size="13">• миграции описывают схему БД;</text>
    <text x="120" y="368" font-size="13">• валидация — до записи в БД;</text>
    <text x="120" y="392" font-size="13">• middleware проверяет доступ;</text>
    <text x="520" y="344" font-size="13">• ресурсы скрывают лишние поля;</text>
    <text x="520" y="368" font-size="13">• ошибки не содержат стек в проде;</text>
    <text x="520" y="392" font-size="13">• тесты проверяют и API, и БД.</text>
  </g>
</svg>
