<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">PHP, PDO и база данных</title>
  <desc id="desc">Схема показывает путь от PHP через PDO и подготовленный запрос к базе данных.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>
  <rect width="920" height="460" fill="#f7f7ff"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#25234a">PDO: безопасная работа с базой</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#25234a">
    <rect x="25" y="110" width="170" height="100" rx="12" fill="#eef0ff" stroke="#818cf8" stroke-width="2"/>
    <text x="110" y="145" text-anchor="middle" font-weight="700">PHP</text>
    <text x="110" y="170" text-anchor="middle" font-size="12">данные от</text>
    <text x="110" y="192" text-anchor="middle" font-size="12">пользователя</text>

    <rect x="230" y="110" width="170" height="100" rx="12" fill="#e8f7ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="315" y="145" text-anchor="middle" font-weight="700">PDO</text>
    <text x="315" y="170" text-anchor="middle" font-size="12">подключение</text>
    <text x="315" y="192" text-anchor="middle" font-size="12">и настройки</text>

    <rect x="435" y="110" width="190" height="100" rx="12" fill="#fff4cc" stroke="#eab308" stroke-width="2"/>
    <text x="530" y="145" text-anchor="middle" font-weight="700">Подготовленный</text>
    <text x="530" y="170" text-anchor="middle" font-weight="700">запрос</text>
    <text x="530" y="192" text-anchor="middle" font-size="12">параметры, не склейка</text>

    <rect x="660" y="110" width="230" height="100" rx="12" fill="#ffe3d6" stroke="#ff6b35" stroke-width="2"/>
    <text x="775" y="145" text-anchor="middle" font-weight="700">База данных</text>
    <text x="775" y="170" text-anchor="middle" font-size="12">PostgreSQL, MySQL,</text>
    <text x="775" y="192" text-anchor="middle" font-size="12">SQLite</text>

    <line x1="195" y1="160" x2="220" y2="160" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="400" y1="160" x2="425" y2="160" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="625" y1="160" x2="650" y2="160" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="90" y="280" width="740" height="120" rx="12" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
    <text x="460" y="312" text-anchor="middle" font-weight="700">Правила PDO</text>
    <text x="120" y="342" font-size="13">• используйте prepare и execute;</text>
    <text x="120" y="366" font-size="13">• не склеивайте SQL с вводом;</text>
    <text x="120" y="390" font-size="13">• включайте исключения для ошибок;</text>
    <text x="520" y="342" font-size="13">• транзакции для нескольких операций;</text>
    <text x="520" y="366" font-size="13">• не показывайте текст ошибки БД;</text>
    <text x="520" y="390" font-size="13">• закрывайте соединение по завершении.</text>
  </g>
</svg>
