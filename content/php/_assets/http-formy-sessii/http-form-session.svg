<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Форма, валидация и сессия</title>
  <desc id="desc">Схема показывает путь данных из формы через валидацию и сессию к ответу.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>
  <rect width="920" height="500" fill="#f7f7ff"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#25234a">Что происходит с формой</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#25234a">
    <rect x="25" y="110" width="160" height="100" rx="12" fill="#eef0ff" stroke="#818cf8" stroke-width="2"/>
    <text x="105" y="145" text-anchor="middle" font-weight="700">Форма</text>
    <text x="105" y="170" text-anchor="middle" font-size="12">HTML + поля</text>
    <text x="105" y="192" text-anchor="middle" font-size="12">method, action</text>

    <rect x="220" y="110" width="170" height="100" rx="12" fill="#fff4cc" stroke="#eab308" stroke-width="2"/>
    <text x="305" y="145" text-anchor="middle" font-weight="700">POST</text>
    <text x="305" y="170" text-anchor="middle" font-size="12">$_POST</text>
    <text x="305" y="192" text-anchor="middle" font-size="12">данные пришли</text>

    <rect x="425" y="110" width="180" height="100" rx="12" fill="#e8f7ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="515" y="145" text-anchor="middle" font-weight="700">Валидация</text>
    <text x="515" y="170" text-anchor="middle" font-size="12">обязательные поля</text>
    <text x="515" y="192" text-anchor="middle" font-size="12">формат, длина</text>

    <rect x="640" y="110" width="250" height="100" rx="12" fill="#ffe3d6" stroke="#ff6b35" stroke-width="2"/>
    <text x="765" y="145" text-anchor="middle" font-weight="700">Сессия и ответ</text>
    <text x="765" y="170" text-anchor="middle" font-size="12">cookie, flash, redirect</text>
    <text x="765" y="192" text-anchor="middle" font-size="12">или JSON</text>

    <line x1="185" y1="160" x2="210" y2="160" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="390" y1="160" x2="415" y2="160" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="605" y1="160" x2="630" y2="160" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="100" y="290" width="720" height="140" rx="12" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
    <text x="460" y="322" text-anchor="middle" font-weight="700">Обязательные проверки</text>
    <text x="130" y="354" font-size="13">• не доверяйте $_POST и $_GET;</text>
    <text x="130" y="378" font-size="13">• экранируйте вывод через htmlspecialchars;</text>
    <text x="130" y="402" font-size="13">• проверяйте CSRF-токен;</text>
    <text x="520" y="354" font-size="13">• не храните пароль в открытом виде;</text>
    <text x="520" y="378" font-size="13">• ограничивайте загрузку файлов;</text>
    <text x="520" y="402" font-size="13">• после POST делайте redirect.</text>
  </g>
</svg>
