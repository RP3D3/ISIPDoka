<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">NavMesh и навигация</title>
  <desc id="desc">Агент строит путь по NavMesh к цели, обходя препятствия.</desc>
  <rect width="900" height="300" rx="16" fill="#1b1c20"/>

  <rect x="24" y="40" width="560" height="210" rx="10" fill="#282a30" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="44" y="68" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">NavMesh Surface</text>

  <rect x="56" y="88" width="480" height="130" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.5"/>
  <rect x="220" y="110" width="90" height="60" rx="4" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-opacity="0.6"/>
  <text x="265" y="145" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Obstacle</text>

  <circle cx="100" cy="180" r="13" fill="#60a5fa"/>
  <text x="100" y="185" text-anchor="middle" fill="#1b1c20" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">A</text>
  <text x="100" y="214" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Agent</text>

  <path d="M114 176 C170 140 220 90 320 100 C400 108 430 150 500 120" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="7 5"/>
  <circle cx="500" cy="120" r="10" fill="#facc15"/>
  <text x="500" y="100" text-anchor="middle" fill="#facc15" font-family="Segoe UI, Arial, sans-serif" font-size="11">Destination</text>

  <rect x="616" y="40" width="260" height="210" rx="10" fill="#282a30" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="636" y="68" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Компоненты</text>
  <text x="636" y="98" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">NavMeshSurface</text>
  <text x="636" y="120" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">запекает проходимую зону</text>
  <text x="636" y="148" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">NavMeshAgent</text>
  <text x="636" y="170" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">строит путь и двигает объект</text>
  <text x="636" y="198" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">SetDestination(target)</text>
  <text x="636" y="220" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">запускает движение к цели</text>

  <text x="24" y="280" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">NavMesh описывает, где ходить можно, а где нельзя. Агент сам обходит препятствия.</text>
</svg>
