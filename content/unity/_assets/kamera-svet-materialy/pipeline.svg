<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Путь кадра в Unity</title>
  <desc id="desc">Камера видит объекты, свет формирует освещение, материал задаёт поверхность, Volume добавляет пост-обработку.</desc>
  <rect width="900" height="220" rx="16" fill="#1b1c20"/>

  <text x="24" y="34" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Из чего складывается картинка</text>

  <rect x="24" y="70" width="190" height="100" rx="8" fill="#282a30" stroke="#60a5fa" stroke-opacity="0.6"/>
  <text x="119" y="98" text-anchor="middle" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">1. Камера</text>
  <text x="119" y="122" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">projection, FOV</text>
  <text x="119" y="142" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">clipping, culling</text>

  <rect x="244" y="70" width="190" height="100" rx="8" fill="#282a30" stroke="#fbbf24" stroke-opacity="0.6"/>
  <text x="339" y="98" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">2. Свет</text>
  <text x="339" y="122" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">Directional, Point</text>
  <text x="339" y="142" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">тени, lightmaps</text>

  <rect x="464" y="70" width="190" height="100" rx="8" fill="#282a30" stroke="#34d399" stroke-opacity="0.6"/>
  <text x="559" y="98" text-anchor="middle" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">3. Материал</text>
  <text x="559" y="122" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">Base Map, Metallic</text>
  <text x="559" y="142" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">Smoothness, Emission</text>

  <rect x="684" y="70" width="192" height="100" rx="8" fill="#282a30" stroke="#f43f5e" stroke-opacity="0.65"/>
  <text x="780" y="98" text-anchor="middle" fill="#f43f5e" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">4. Volume</text>
  <text x="780" y="122" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">Bloom, Vignette</text>
  <text x="780" y="142" text-anchor="middle" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">Color Adjustments</text>

  <path d="M214 120 L244 120" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M434 120 L464 120" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M654 120 L684 120" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <text x="450" y="200" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="12">Ошибка на любом шаге видна в Game: не тот ракурс, плоский свет, розовый материал или «мыльная» картинка</text>
</svg>
