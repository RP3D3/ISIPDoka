<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Схема основных окон Unity Editor</title>
  <desc id="desc">Toolbar сверху, Hierarchy слева, Scene в центре, Inspector справа, Project и Console снизу.</desc>
  <rect width="900" height="520" rx="16" fill="#1b1c20"/>
  <rect x="16" y="16" width="868" height="40" rx="8" fill="#282a30" stroke="#f43f5e" stroke-opacity="0.55"/>
  <text x="34" y="42" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Toolbar</text>
  <text x="130" y="42" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Play, Pause, Step, слои, раскладка окон</text>

  <rect x="16" y="72" width="240" height="250" rx="8" fill="#282a30" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="32" y="98" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Hierarchy</text>
  <text x="32" y="122" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Список объектов сцены</text>
  <rect x="32" y="142" width="208" height="24" rx="5" fill="#1b1c20"/>
  <text x="42" y="159" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">Main Camera</text>
  <rect x="32" y="174" width="208" height="24" rx="5" fill="#1b1c20"/>
  <text x="42" y="191" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">Directional Light</text>
  <rect x="32" y="206" width="208" height="24" rx="5" fill="#1b1c20"/>
  <text x="42" y="223" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">Player</text>

  <rect x="272" y="72" width="360" height="250" rx="8" fill="#282a30" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="288" y="98" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Scene</text>
  <text x="288" y="122" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">3D-сцена: камера, свет, объекты</text>
  <path d="M300 230 L450 160 L600 230 L450 300 Z" fill="#f43f5e" fill-opacity="0.16" stroke="#f43f5e" stroke-opacity="0.55"/>
  <path d="M300 230 L450 300 L450 160" fill="none" stroke="#f43f5e" stroke-opacity="0.35"/>
  <circle cx="450" cy="230" r="5" fill="#f43f5e"/>

  <rect x="648" y="72" width="236" height="250" rx="8" fill="#282a30" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="664" y="98" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Inspector</text>
  <text x="664" y="122" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Свойства выбранного объекта</text>
  <rect x="664" y="142" width="204" height="24" rx="5" fill="#1b1c20"/>
  <text x="674" y="159" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">Transform</text>
  <rect x="664" y="174" width="204" height="24" rx="5" fill="#1b1c20"/>
  <text x="674" y="191" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">Rigidbody</text>
  <rect x="664" y="206" width="204" height="24" rx="5" fill="#1b1c20"/>
  <text x="674" y="223" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">Player Movement</text>

  <rect x="16" y="338" width="560" height="166" rx="8" fill="#282a30" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="32" y="364" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Project</text>
  <text x="32" y="388" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Файлы проекта: Assets, Packages, ProjectSettings</text>
  <rect x="32" y="406" width="160" height="78" rx="6" fill="#1b1c20"/>
  <text x="44" y="430" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">Assets</text>
  <text x="44" y="452" fill="#9e9ea0" font-family="Consolas, monospace" font-size="11">Scenes</text>
  <text x="44" y="470" fill="#9e9ea0" font-family="Consolas, monospace" font-size="11">Scripts</text>
  <rect x="204" y="406" width="160" height="78" rx="6" fill="#1b1c20"/>
  <text x="216" y="430" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">Packages</text>
  <text x="216" y="452" fill="#9e9ea0" font-family="Consolas, monospace" font-size="11">manifest.json</text>
  <rect x="376" y="406" width="184" height="78" rx="6" fill="#1b1c20"/>
  <text x="388" y="430" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">ProjectSettings</text>
  <text x="388" y="452" fill="#9e9ea0" font-family="Consolas, monospace" font-size="11">Input, Physics, Tags</text>

  <rect x="592" y="338" width="292" height="166" rx="8" fill="#282a30" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="608" y="364" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Console</text>
  <text x="608" y="388" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Логи, предупреждения и ошибки</text>
  <rect x="608" y="406" width="260" height="78" rx="6" fill="#1b1c20"/>
  <text x="620" y="430" fill="#e2e8f0" font-family="Consolas, monospace" font-size="12">Debug.Log("Start");</text>
  <text x="620" y="452" fill="#9e9ea0" font-family="Consolas, monospace" font-size="11">Start</text>
  <text x="620" y="470" fill="#f43f5e" font-family="Consolas, monospace" font-size="11">NullReferenceException</text>
</svg>
