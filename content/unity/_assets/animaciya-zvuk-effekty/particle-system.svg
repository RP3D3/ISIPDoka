<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Модули Particle System</title>
  <desc id="desc">Emission, Shape, Lifetime, Speed, Color over Lifetime, Size over Lifetime и Renderer.</desc>
  <rect width="900" height="300" rx="16" fill="#1b1c20"/>
  <text x="24" y="34" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Particle System</text>

  <rect x="24" y="56" width="170" height="54" rx="8" fill="#282a30" stroke="#f43f5e" stroke-opacity="0.6"/>
  <text x="109" y="79" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Emission</text>
  <text x="109" y="98" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">rate over time</text>

  <rect x="214" y="56" width="170" height="54" rx="8" fill="#282a30" stroke="#f43f5e" stroke-opacity="0.6"/>
  <text x="299" y="79" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Shape</text>
  <text x="299" y="98" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">cone, sphere, box</text>

  <rect x="404" y="56" width="170" height="54" rx="8" fill="#282a30" stroke="#f43f5e" stroke-opacity="0.6"/>
  <text x="489" y="79" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Lifetime</text>
  <text x="489" y="98" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">start lifetime</text>

  <rect x="594" y="56" width="170" height="54" rx="8" fill="#282a30" stroke="#f43f5e" stroke-opacity="0.6"/>
  <text x="679" y="79" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Speed</text>
  <text x="679" y="98" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">start speed</text>

  <rect x="24" y="130" width="260" height="54" rx="8" fill="#282a30" stroke="#60a5fa" stroke-opacity="0.7"/>
  <text x="154" y="153" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Color over Lifetime</text>
  <text x="154" y="172" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">градиент цвета</text>

  <rect x="304" y="130" width="260" height="54" rx="8" fill="#282a30" stroke="#60a5fa" stroke-opacity="0.7"/>
  <text x="434" y="153" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Size over Lifetime</text>
  <text x="434" y="172" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">кривая размера</text>

  <rect x="584" y="130" width="180" height="54" rx="8" fill="#282a30" stroke="#60a5fa" stroke-opacity="0.7"/>
  <text x="674" y="153" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Renderer</text>
  <text x="674" y="172" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">material, mesh</text>

  <text x="24" y="232" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Частицы живут от Start Lifetime, двигаются от Start Speed и меняют цвет/размер по кривым.</text>

  <circle cx="760" cy="236" r="4" fill="#f43f5e"/>
  <circle cx="780" cy="250" r="3" fill="#f43f5e" fill-opacity="0.8"/>
  <circle cx="800" cy="226" r="2.5" fill="#f43f5e" fill-opacity="0.6"/>
  <circle cx="820" cy="246" r="3.5" fill="#60a5fa" fill-opacity="0.8"/>
  <circle cx="840" cy="232" r="2" fill="#60a5fa" fill-opacity="0.6"/>
</svg>
