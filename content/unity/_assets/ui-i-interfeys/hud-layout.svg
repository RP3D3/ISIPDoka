<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Схема HUD с якорями по углам экрана</title>
  <desc id="desc">Полоса здоровья в левом верхнем углу, таймер по центру, счёт справа, патроны слева снизу и мини-карта справа снизу. Углы экрана отмечены якорями.</desc>
  <rect width="900" height="420" rx="16" fill="#1b1c20"/>

  <text x="60" y="30" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">HUD: элементы прижаты к якорям</text>

  <rect x="60" y="50" width="780" height="320" rx="10" fill="#202227" stroke="#4b5563" stroke-width="2"/>

  <path d="M60 70 V50 H80" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <path d="M820 50 H840 V70" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <path d="M60 350 V370 H80" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <path d="M840 350 V370 H820" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <text x="88" y="66" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="11">(0, 1)</text>
  <text x="812" y="66" fill="#60a5fa" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11">(1, 1)</text>
  <text x="88" y="366" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="11">(0, 0)</text>
  <text x="812" y="366" fill="#60a5fa" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11">(1, 0)</text>

  <text x="90" y="100" fill="#d1d5db" font-family="Segoe UI, Arial, sans-serif" font-size="12">Здоровье</text>
  <rect x="90" y="108" width="240" height="22" rx="5" fill="#3a3d46"/>
  <rect x="90" y="108" width="156" height="22" rx="5" fill="#22c55e"/>
  <text x="210" y="124" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">65 / 100</text>

  <rect x="390" y="92" width="120" height="40" rx="8" fill="#282a30" stroke="#f43f5e" stroke-opacity="0.7"/>
  <text x="450" y="118" fill="#ffffff" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">01:24</text>

  <text x="810" y="112" fill="#d1d5db" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="12">Счёт</text>
  <text x="810" y="136" fill="#ffffff" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">1250</text>

  <text x="90" y="330" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">30 / 90</text>
  <text x="90" y="350" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">патроны</text>

  <rect x="700" y="280" width="110" height="70" rx="8" fill="#282a30" stroke="#4b5563"/>
  <path d="M710 340 L740 310 L760 328 L780 300 L800 330" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="755" cy="320" r="4" fill="#f43f5e"/>

  <text x="60" y="398" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="12">Anchor Min/Max задают точку привязки, Pivot — точку отсчёта, Anchored Position — смещение.</text>
</svg>
