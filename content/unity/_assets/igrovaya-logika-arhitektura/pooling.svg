<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Пул объектов</title>
  <desc id="desc">Spawner берёт объект из пула, активирует его, затем возвращает обратно.</desc>
  <rect width="900" height="280" rx="16" fill="#1b1c20"/>

  <rect x="24" y="40" width="180" height="60" rx="8" fill="#282a30" stroke="#f43f5e" stroke-opacity="0.7"/>
  <text x="114" y="65" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Spawner</text>
  <text x="114" y="85" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">запрашивает объект</text>

  <path d="M204 70 H280" stroke="#f43f5e" stroke-width="2"/>

  <rect x="280" y="28" width="220" height="84" rx="8" fill="#282a30" stroke="#60a5fa" stroke-opacity="0.7"/>
  <text x="390" y="53" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Pool (неактивные)</text>
  <text x="390" y="75" text-anchor="middle" fill="#9e9ea0" font-family="Consolas, monospace" font-size="11">bullet_01</text>
  <text x="390" y="93" text-anchor="middle" fill="#9e9ea0" font-family="Consolas, monospace" font-size="11">bullet_02 ...</text>

  <path d="M500 70 H580" stroke="#60a5fa" stroke-width="2"/>
  <text x="540" y="58" text-anchor="middle" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="11">Activate</text>

  <rect x="580" y="40" width="180" height="60" rx="8" fill="#282a30" stroke="#f43f5e" stroke-opacity="0.7"/>
  <text x="670" y="65" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Scene</text>
  <text x="670" y="85" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">объект работает</text>

  <path d="M670 100 V170 H390 V112" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="540" y="190" text-anchor="middle" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="11">Return to pool</text>

  <text x="24" y="238" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Вместо Instantiate/Destroy объект выключается и возвращается в пул.</text>
</svg>
