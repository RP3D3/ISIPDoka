<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">ScriptableObject как общий конфиг</title>
  <desc id="desc">Один ассет EnemyConfig используется несколькими объектами Enemy.</desc>
  <rect width="900" height="300" rx="16" fill="#1b1c20"/>

  <rect x="24" y="24" width="260" height="120" rx="10" fill="#282a30" stroke="#f43f5e" stroke-opacity="0.7"/>
  <text x="44" y="52" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">EnemyConfig</text>
  <text x="44" y="76" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">maxHealth = 100</text>
  <text x="44" y="96" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">speed = 2.5</text>
  <text x="44" y="116" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">damage = 15</text>
  <text x="44" y="136" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">prefab = Enemy.prefab</text>

  <path d="M284 84 H360" stroke="#f43f5e" stroke-width="2"/>
  <path d="M360 40 V180" stroke="#f43f5e" stroke-width="2"/>
  <path d="M360 40 H430" stroke="#f43f5e" stroke-width="2"/>
  <path d="M360 180 H430" stroke="#f43f5e" stroke-width="2"/>

  <rect x="430" y="20" width="200" height="54" rx="8" fill="#282a30" stroke="#60a5fa" stroke-opacity="0.7"/>
  <text x="530" y="43" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Enemy A</text>
  <text x="530" y="61" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">читает config</text>

  <rect x="430" y="92" width="200" height="54" rx="8" fill="#282a30" stroke="#60a5fa" stroke-opacity="0.7"/>
  <text x="530" y="115" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Enemy B</text>
  <text x="530" y="133" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">читает config</text>

  <rect x="430" y="164" width="200" height="54" rx="8" fill="#282a30" stroke="#60a5fa" stroke-opacity="0.7"/>
  <text x="530" y="187" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Enemy C</text>
  <text x="530" y="205" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">читает config</text>

  <text x="24" y="254" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Один ассет — много объектов. Меняем данные в одном месте, не трогая префабы.</text>
</svg>
