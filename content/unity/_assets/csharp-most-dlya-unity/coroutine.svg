<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Корутина</title>
  <desc id="desc">StartCoroutine запускает корутину, yield return приостанавливает, затем выполнение продолжается.</desc>
  <rect width="900" height="300" rx="16" fill="#1b1c20"/>

  <text x="24" y="36" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Coroutine</text>

  <path d="M40 120 H860" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <circle cx="100" cy="120" r="9" fill="#f43f5e"/>
  <text x="100" y="100" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12">StartCoroutine</text>
  <text x="100" y="150" text-anchor="middle" fill="#9e9ea0" font-family="Consolas, monospace" font-size="10">0.0 s</text>

  <circle cx="320" cy="120" r="9" fill="#60a5fa"/>
  <text x="320" y="100" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12">yield return</text>
  <text x="320" y="150" text-anchor="middle" fill="#9e9ea0" font-family="Consolas, monospace" font-size="10">WaitForSeconds(1)</text>

  <circle cx="540" cy="120" r="9" fill="#60a5fa"/>
  <text x="540" y="100" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12">продолжение</text>
  <text x="540" y="150" text-anchor="middle" fill="#9e9ea0" font-family="Consolas, monospace" font-size="10">1.0 s</text>

  <circle cx="760" cy="120" r="9" fill="#a78bfa"/>
  <text x="760" y="100" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12">конец</text>
  <text x="760" y="150" text-anchor="middle" fill="#9e9ea0" font-family="Consolas, monospace" font-size="10">2.0 s</text>

  <path d="M100 120 H320" stroke="#f43f5e" stroke-width="3"/>
  <path d="M320 120 H540" stroke="#60a5fa" stroke-width="3" stroke-dasharray="6 4"/>
  <path d="M540 120 H760" stroke="#a78bfa" stroke-width="3"/>

  <rect x="40" y="196" width="390" height="70" rx="8" fill="#282a30" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="56" y="220" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11">IEnumerator SpawnWave()</text>
  <text x="56" y="240" fill="#9e9ea0" font-family="Consolas, monospace" font-size="11">yield return new WaitForSeconds(1f);</text>
  <text x="56" y="258" fill="#9e9ea0" font-family="Consolas, monospace" font-size="11">Spawn();</text>

  <rect x="470" y="196" width="390" height="70" rx="8" fill="#282a30" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="486" y="220" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12">Корутина не блокирует кадр.</text>
  <text x="486" y="240" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Она возвращается в очередь после паузы.</text>
  <text x="486" y="258" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Не путайте с отдельным потоком.</text>

  <text x="24" y="288" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="12">Для паузы используйте WaitForSecondsRealtime, если timeScale = 0.</text>
</svg>
