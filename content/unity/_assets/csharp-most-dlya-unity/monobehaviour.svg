<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Класс MonoBehaviour и компонент</title>
  <desc id="desc">C#-класс наследуется от MonoBehaviour и становится компонентом GameObject.</desc>
  <rect width="900" height="300" rx="16" fill="#1b1c20"/>

  <rect x="24" y="34" width="330" height="210" rx="10" fill="#282a30" stroke="#f43f5e" stroke-opacity="0.7"/>
  <text x="44" y="64" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">PlayerController.cs</text>
  <text x="44" y="94" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">public class PlayerController</text>
  <text x="44" y="116" fill="#e2e8f0" font-family="Consolas, monospace" font-size="13">    : MonoBehaviour</text>
  <text x="44" y="144" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">{</text>
  <text x="44" y="166" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">    void Update() { ... }</text>
  <text x="44" y="188" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">}</text>
  <text x="44" y="222" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="12">Класс — это код, а не объект на сцене.</text>

  <path d="M354 140 H424" stroke="#f43f5e" stroke-width="2"/>
  <path d="M424 140 L414 134 M424 140 L414 146" stroke="#f43f5e" stroke-width="2"/>

  <rect x="424" y="34" width="200" height="90" rx="10" fill="#282a30" stroke="#60a5fa" stroke-opacity="0.7"/>
  <text x="524" y="64" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Player</text>
  <text x="524" y="86" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="12">GameObject</text>
  <text x="524" y="108" text-anchor="middle" fill="#9e9ea0" font-family="Consolas, monospace" font-size="11">PlayerController</text>

  <rect x="660" y="34" width="216" height="210" rx="10" fill="#282a30" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="680" y="64" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Доступ изнутри</text>
  <text x="680" y="94" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">gameObject</text>
  <text x="680" y="116" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">transform</text>
  <text x="680" y="138" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">enabled</text>
  <text x="680" y="160" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">name</text>
  <text x="680" y="182" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">GetComponent&lt;T&gt;()</text>
  <text x="680" y="216" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Это свойства компонента.</text>

  <text x="24" y="274" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">MonoBehaviour связывает C#-класс с GameObject и даёт доступ к жизненному циклу.</text>
</svg>
