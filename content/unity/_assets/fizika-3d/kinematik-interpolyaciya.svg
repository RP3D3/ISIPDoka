<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">FixedUpdate, рендер и интерполяция</title>
  <desc id="desc">Физика считается шагами FixedUpdate, кадры рендера идут чаще. Интерполяция сглаживает позицию между шагами физики.</desc>
  <rect width="900" height="420" rx="16" fill="#1b1c20"/>

  <text x="28" y="42" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Физика и рендер идут с разной частотой</text>
  <text x="28" y="68" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Fixed Timestep по умолчанию 0.02 с — это 50 шагов физики в секунду</text>

  <text x="28" y="112" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">FixedUpdate</text>
  <path d="M150 107 L860 107" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="190" cy="107" r="5" fill="#f43f5e"/>
  <circle cx="330" cy="107" r="5" fill="#f43f5e"/>
  <circle cx="470" cy="107" r="5" fill="#f43f5e"/>
  <circle cx="610" cy="107" r="5" fill="#f43f5e"/>
  <circle cx="750" cy="107" r="5" fill="#f43f5e"/>
  <text x="180" y="90" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">0.00</text>
  <text x="320" y="90" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">0.02</text>
  <text x="460" y="90" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">0.04</text>
  <text x="600" y="90" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">0.06</text>

  <text x="28" y="172" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Кадры</text>
  <path d="M150 167 L860 167" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="170" cy="167" r="4" fill="#38bdf8"/>
  <circle cx="225" cy="167" r="4" fill="#38bdf8"/>
  <circle cx="285" cy="167" r="4" fill="#38bdf8"/>
  <circle cx="345" cy="167" r="4" fill="#38bdf8"/>
  <circle cx="405" cy="167" r="4" fill="#38bdf8"/>
  <circle cx="465" cy="167" r="4" fill="#38bdf8"/>
  <circle cx="525" cy="167" r="4" fill="#38bdf8"/>
  <circle cx="585" cy="167" r="4" fill="#38bdf8"/>
  <circle cx="645" cy="167" r="4" fill="#38bdf8"/>
  <text x="160" y="150" fill="#38bdf8" font-family="Consolas, monospace" font-size="12">кадры рендера</text>

  <rect x="28" y="206" width="404" height="180" rx="10" fill="#282a30" stroke="#f43f5e" stroke-opacity="0.55"/>
  <text x="48" y="238" fill="#f43f5e" font-family="Consolas, monospace" font-size="16" font-weight="600">Interpolation: None</text>
  <text x="48" y="266" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Позиция обновляется только на шаге физики.</text>
  <text x="48" y="290" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">На быстром объекте видно рывки.</text>
  <path d="M60 350 L120 350 L120 330 L180 330 L180 310 L240 310 L240 290 L300 290 L300 270 L360 270" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
  <text x="370" y="300" fill="#9e9ea0" font-family="Consolas, monospace" font-size="11">ступеньки</text>

  <rect x="468" y="206" width="404" height="180" rx="10" fill="#282a30" stroke="#38bdf8" stroke-opacity="0.55"/>
  <text x="488" y="238" fill="#38bdf8" font-family="Consolas, monospace" font-size="16" font-weight="600">Interpolation: Interpolate</text>
  <text x="488" y="266" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Рендер плавно смешивает прошлую и текущую</text>
  <text x="488" y="290" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">позицию тела. Движение выглядит плавно.</text>
  <path d="M500 350 L860 270" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="500" cy="350" r="3" fill="#38bdf8"/>
  <circle cx="860" cy="270" r="3" fill="#38bdf8"/>
  <text x="710" y="330" fill="#9e9ea0" font-family="Consolas, monospace" font-size="11">плавная линия</text>
</svg>
