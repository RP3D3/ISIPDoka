<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Асинхронность, тесты и деплой Python-бэкенда</title>
  <desc id="desc">Схема показывает async, фоновые задачи, pytest, Docker и healthcheck.</desc>
  <rect width="920" height="500" fill="#f5f8ff"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2d4a">От async до деплоя</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#1f2d4a">
    <rect x="30" y="100" width="200" height="120" rx="12" fill="#e8f0ff" stroke="#3776ab" stroke-width="2"/>
    <text x="130" y="132" text-anchor="middle" font-weight="700">async/await</text>
    <text x="130" y="158" text-anchor="middle" font-size="12">неблокирующий I/O</text>
    <text x="130" y="180" text-anchor="middle" font-size="12">event loop</text>
    <text x="130" y="202" text-anchor="middle" font-size="12">asyncio</text>

    <rect x="255" y="100" width="200" height="120" rx="12" fill="#fff7d6" stroke="#eab308" stroke-width="2"/>
    <text x="355" y="132" text-anchor="middle" font-weight="700">Фон</text>
    <text x="355" y="158" text-anchor="middle" font-size="12">BackgroundTasks</text>
    <text x="355" y="180" text-anchor="middle" font-size="12">Celery, RQ</text>
    <text x="355" y="202" text-anchor="middle" font-size="12">retry</text>

    <rect x="480" y="100" width="200" height="120" rx="12" fill="#e9f8ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="580" y="132" text-anchor="middle" font-weight="700">Тесты</text>
    <text x="580" y="158" text-anchor="middle" font-size="12">pytest</text>
    <text x="580" y="180" text-anchor="middle" font-size="12">fixtures</text>
    <text x="580" y="202" text-anchor="middle" font-size="12">test DB</text>

    <rect x="705" y="100" width="185" height="120" rx="12" fill="#ffe8e8" stroke="#ef4444" stroke-width="2"/>
    <text x="797" y="132" text-anchor="middle" font-weight="700">Деплой</text>
    <text x="797" y="158" text-anchor="middle" font-size="12">Docker</text>
    <text x="797" y="180" text-anchor="middle" font-size="12">uvicorn</text>
    <text x="797" y="202" text-anchor="middle" font-size="12">healthcheck</text>

    <rect x="90" y="285" width="740" height="140" rx="12" fill="#ffffff" stroke="#3776ab" stroke-width="2"/>
    <text x="460" y="317" text-anchor="middle" font-weight="700">Что важно помнить</text>
    <text x="120" y="349" font-size="13">• async не ускоряет CPU-код;</text>
    <text x="120" y="373" font-size="13">• блокирующий вызов ломает event loop;</text>
    <text x="120" y="397" font-size="13">• фоновые задачи не должны теряться;</text>
    <text x="520" y="349" font-size="13">• тесты используют отдельную БД;</text>
    <text x="520" y="373" font-size="13">• миграции до запуска;</text>
    <text x="520" y="397" font-size="13">• логи и healthcheck обязательны.</text>
  </g>
</svg>
