<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Структура Python-проекта</title>
  <desc id="desc">Схема показывает модули, venv, pyproject, типы, логи и конфигурацию.</desc>
  <rect width="920" height="500" fill="#f5f8ff"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2d4a">Проект, который можно поддерживать</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#1f2d4a">
    <rect x="25" y="100" width="200" height="110" rx="12" fill="#e8f0ff" stroke="#3776ab" stroke-width="2"/>
    <text x="125" y="132" text-anchor="middle" font-weight="700">Модули</text>
    <text x="125" y="158" text-anchor="middle" font-size="12">import</text>
    <text x="125" y="180" text-anchor="middle" font-size="12">пакеты</text>

    <rect x="250" y="100" width="200" height="110" rx="12" fill="#fff7d6" stroke="#eab308" stroke-width="2"/>
    <text x="350" y="132" text-anchor="middle" font-weight="700">Окружение</text>
    <text x="350" y="158" text-anchor="middle" font-size="12">venv, pip</text>
    <text x="350" y="180" text-anchor="middle" font-size="12">pyproject</text>

    <rect x="475" y="100" width="200" height="110" rx="12" fill="#e9f8ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="575" y="132" text-anchor="middle" font-weight="700">Типы</text>
    <text x="575" y="158" text-anchor="middle" font-size="12">type hints</text>
    <text x="575" y="180" text-anchor="middle" font-size="12">mypy</text>

    <rect x="700" y="100" width="190" height="110" rx="12" fill="#ffe8e8" stroke="#ef4444" stroke-width="2"/>
    <text x="795" y="132" text-anchor="middle" font-weight="700">Логи и конфиг</text>
    <text x="795" y="158" text-anchor="middle" font-size="12">logging</text>
    <text x="795" y="180" text-anchor="middle" font-size="12">env, secrets</text>

    <rect x="90" y="285" width="740" height="140" rx="12" fill="#ffffff" stroke="#3776ab" stroke-width="2"/>
    <text x="460" y="317" text-anchor="middle" font-weight="700">Правила проекта</text>
    <text x="120" y="349" font-size="13">• зависимости фиксируются;</text>
    <text x="120" y="373" font-size="13">• секреты не в коде;</text>
    <text x="120" y="397" font-size="13">• типы помогают читать код;</text>
    <text x="520" y="349" font-size="13">• логи структурированы;</text>
    <text x="520" y="373" font-size="13">• конфиг из окружения;</text>
    <text x="520" y="397" font-size="13">• структура важнее количества файлов.</text>
  </g>
</svg>
