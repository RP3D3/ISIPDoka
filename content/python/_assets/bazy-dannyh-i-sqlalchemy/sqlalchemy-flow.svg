<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Python, SQLAlchemy и база данных</title>
  <desc id="desc">Схема показывает путь от Python через SQLAlchemy к базе данных и результату.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3776ab"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#f5f8ff"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2d4a">SQLAlchemy: мост к базе</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#1f2d4a">
    <rect x="25" y="110" width="180" height="100" rx="12" fill="#e8f0ff" stroke="#3776ab" stroke-width="2"/>
    <text x="115" y="144" text-anchor="middle" font-weight="700">Python</text>
    <text x="115" y="168" text-anchor="middle" font-size="12">модели и запросы</text>
    <text x="115" y="190" text-anchor="middle" font-size="12">session</text>

    <rect x="245" y="110" width="190" height="100" rx="12" fill="#fff7d6" stroke="#eab308" stroke-width="2"/>
    <text x="340" y="144" text-anchor="middle" font-weight="700">SQLAlchemy</text>
    <text x="340" y="168" text-anchor="middle" font-size="12">ORM и Core</text>
    <text x="340" y="190" text-anchor="middle" font-size="12">транзакции</text>

    <rect x="475" y="110" width="190" height="100" rx="12" fill="#e9f8ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="570" y="144" text-anchor="middle" font-weight="700">Драйвер</text>
    <text x="570" y="168" text-anchor="middle" font-size="12">psycopg</text>
    <text x="570" y="190" text-anchor="middle" font-size="12">sqlite3</text>

    <rect x="705" y="110" width="185" height="100" rx="12" fill="#ffe8e8" stroke="#ef4444" stroke-width="2"/>
    <text x="797" y="144" text-anchor="middle" font-weight="700">База данных</text>
    <text x="797" y="168" text-anchor="middle" font-size="12">PostgreSQL</text>
    <text x="797" y="190" text-anchor="middle" font-size="12">SQLite</text>

    <line x1="205" y1="160" x2="235" y2="160" stroke="#3776ab" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="435" y1="160" x2="465" y2="160" stroke="#3776ab" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="665" y1="160" x2="695" y2="160" stroke="#3776ab" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="90" y="285" width="740" height="130" rx="12" fill="#ffffff" stroke="#3776ab" stroke-width="2"/>
    <text x="460" y="317" text-anchor="middle" font-weight="700">Что важно помнить</text>
    <text x="120" y="349" font-size="13">• сессия — единица работы;</text>
    <text x="120" y="373" font-size="13">• commit и rollback обязательны;</text>
    <text x="120" y="397" font-size="13">• миграции — через Alembic;</text>
    <text x="520" y="349" font-size="13">• N+1 лечится eager loading;</text>
    <text x="520" y="373" font-size="13">• параметры защищают от инъекций;</text>
    <text x="520" y="397" font-size="13">• SQL полезно понимать.</text>
  </g>
</svg>
