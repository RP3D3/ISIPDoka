<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Основы Python</title>
  <desc id="desc">Схема показывает синтаксис, типы, условия, циклы и функции Python.</desc>
  <rect width="920" height="480" fill="#f5f8ff"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2d4a">Python: от строки к функции</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#1f2d4a">
    <rect x="30" y="100" width="200" height="110" rx="12" fill="#e8f0ff" stroke="#3776ab" stroke-width="2"/>
    <text x="130" y="132" text-anchor="middle" font-weight="700">Синтаксис</text>
    <text x="130" y="158" text-anchor="middle" font-size="12">отступы</text>
    <text x="130" y="180" text-anchor="middle" font-size="12">print, переменные</text>

    <rect x="255" y="100" width="200" height="110" rx="12" fill="#fff7d6" stroke="#eab308" stroke-width="2"/>
    <text x="355" y="132" text-anchor="middle" font-weight="700">Типы</text>
    <text x="355" y="158" text-anchor="middle" font-size="12">int, float, str</text>
    <text x="355" y="180" text-anchor="middle" font-size="12">bool, None</text>

    <rect x="480" y="100" width="200" height="110" rx="12" fill="#e9f8ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="580" y="132" text-anchor="middle" font-weight="700">Управление</text>
    <text x="580" y="158" text-anchor="middle" font-size="12">if, for, while</text>
    <text x="580" y="180" text-anchor="middle" font-size="12">range, break</text>

    <rect x="705" y="100" width="185" height="110" rx="12" fill="#ffe8e8" stroke="#ef4444" stroke-width="2"/>
    <text x="797" y="132" text-anchor="middle" font-weight="700">Функции</text>
    <text x="797" y="158" text-anchor="middle" font-size="12">def, return</text>
    <text x="797" y="180" text-anchor="middle" font-size="12">аргументы</text>

    <rect x="90" y="280" width="740" height="140" rx="12" fill="#ffffff" stroke="#3776ab" stroke-width="2"/>
    <text x="460" y="312" text-anchor="middle" font-weight="700">Что важно помнить</text>
    <text x="120" y="344" font-size="13">• отступы — часть синтаксиса;</text>
    <text x="120" y="368" font-size="13">• тип определяется значением;</text>
    <text x="120" y="392" font-size="13">• функции уменьшают дублирование;</text>
    <text x="520" y="344" font-size="13">• ошибки ловят через try/except;</text>
    <text x="520" y="368" font-size="13">• код читают чаще, чем пишут;</text>
    <text x="520" y="392" font-size="13">• сначала данные, потом структура.</text>
  </g>
</svg>
