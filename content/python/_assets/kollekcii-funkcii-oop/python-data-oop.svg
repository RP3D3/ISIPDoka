<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Коллекции, функции и ООП в Python</title>
  <desc id="desc">Схема показывает списки, словари, генераторы, классы и dataclasses.</desc>
  <rect width="920" height="500" fill="#f5f8ff"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2d4a">От данных к объектам</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#1f2d4a">
    <rect x="25" y="100" width="170" height="110" rx="12" fill="#e8f0ff" stroke="#3776ab" stroke-width="2"/>
    <text x="110" y="132" text-anchor="middle" font-weight="700">Списки</text>
    <text x="110" y="158" text-anchor="middle" font-size="12">list, tuple</text>
    <text x="110" y="180" text-anchor="middle" font-size="12">срезы</text>

    <rect x="215" y="100" width="170" height="110" rx="12" fill="#fff7d6" stroke="#eab308" stroke-width="2"/>
    <text x="300" y="132" text-anchor="middle" font-weight="700">Словари</text>
    <text x="300" y="158" text-anchor="middle" font-size="12">dict, set</text>
    <text x="300" y="180" text-anchor="middle" font-size="12">ключи и значения</text>

    <rect x="405" y="100" width="170" height="110" rx="12" fill="#e9f8ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="490" y="132" text-anchor="middle" font-weight="700">Генераторы</text>
    <text x="490" y="158" text-anchor="middle" font-size="12">yield</text>
    <text x="490" y="180" text-anchor="middle" font-size="12">ленивые данные</text>

    <rect x="595" y="100" width="140" height="110" rx="12" fill="#ffe8e8" stroke="#ef4444" stroke-width="2"/>
    <text x="665" y="132" text-anchor="middle" font-weight="700">Классы</text>
    <text x="665" y="158" text-anchor="middle" font-size="12">__init__</text>
    <text x="665" y="180" text-anchor="middle" font-size="12">методы</text>

    <rect x="755" y="100" width="140" height="110" rx="12" fill="#f3e8ff" stroke="#9c36b5" stroke-width="2"/>
    <text x="825" y="132" text-anchor="middle" font-weight="700">Dataclass</text>
    <text x="825" y="158" text-anchor="middle" font-size="12">данные</text>
    <text x="825" y="180" text-anchor="middle" font-size="12">меньше кода</text>

    <rect x="90" y="285" width="740" height="140" rx="12" fill="#ffffff" stroke="#3776ab" stroke-width="2"/>
    <text x="460" y="317" text-anchor="middle" font-weight="700">Что важно помнить</text>
    <text x="120" y="349" font-size="13">• компрехеншены короче циклов;</text>
    <text x="120" y="373" font-size="13">• генератор экономит память;</text>
    <text x="120" y="397" font-size="13">• класс объединяет данные и поведение;</text>
    <text x="520" y="349" font-size="13">• наследование — не всегда лучший выбор;</text>
    <text x="520" y="373" font-size="13">• dataclass удобен для моделей;</text>
    <text x="520" y="397" font-size="13">• протокол задаёт контракт.</text>
  </g>
</svg>
