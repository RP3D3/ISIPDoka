<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Auth, CORS и безопасность Python API</title>
  <desc id="desc">Схема показывает пароли, токены, scopes, CORS и ограничение запросов.</desc>
  <rect width="920" height="500" fill="#f5f8ff"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2d4a">Кто ты и что тебе можно</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#1f2d4a">
    <rect x="30" y="100" width="200" height="120" rx="12" fill="#e8f0ff" stroke="#3776ab" stroke-width="2"/>
    <text x="130" y="132" text-anchor="middle" font-weight="700">Пароли</text>
    <text x="130" y="158" text-anchor="middle" font-size="12">argon2 или bcrypt</text>
    <text x="130" y="180" text-anchor="middle" font-size="12">только хеш</text>
    <text x="130" y="202" text-anchor="middle" font-size="12">без логов</text>

    <rect x="255" y="100" width="200" height="120" rx="12" fill="#fff7d6" stroke="#eab308" stroke-width="2"/>
    <text x="355" y="132" text-anchor="middle" font-weight="700">Токены</text>
    <text x="355" y="158" text-anchor="middle" font-size="12">JWT, OAuth2</text>
    <text x="355" y="180" text-anchor="middle" font-size="12">scopes и роли</text>
    <text x="355" y="202" text-anchor="middle" font-size="12">срок жизни</text>

    <rect x="480" y="100" width="200" height="120" rx="12" fill="#e9f8ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="580" y="132" text-anchor="middle" font-weight="700">CORS</text>
    <text x="580" y="158" text-anchor="middle" font-size="12">конкретный origin</text>
    <text x="580" y="180" text-anchor="middle" font-size="12">preflight</text>
    <text x="580" y="202" text-anchor="middle" font-size="12">credentials</text>

    <rect x="705" y="100" width="185" height="120" rx="12" fill="#ffe8e8" stroke="#ef4444" stroke-width="2"/>
    <text x="797" y="132" text-anchor="middle" font-weight="700">Лимиты</text>
    <text x="797" y="158" text-anchor="middle" font-size="12">rate limiting</text>
    <text x="797" y="180" text-anchor="middle" font-size="12">429</text>
    <text x="797" y="202" text-anchor="middle" font-size="12">Retry-After</text>

    <rect x="90" y="285" width="740" height="140" rx="12" fill="#ffffff" stroke="#3776ab" stroke-width="2"/>
    <text x="460" y="317" text-anchor="middle" font-weight="700">Правила</text>
    <text x="120" y="349" font-size="13">• права проверяются на сервере;</text>
    <text x="120" y="373" font-size="13">• секреты не в коде;</text>
    <text x="120" y="397" font-size="13">• токен не в URL;</text>
    <text x="520" y="349" font-size="13">• CORS не открыт всем;</text>
    <text x="520" y="373" font-size="13">• 401 и 403 различаются;</text>
    <text x="520" y="397" font-size="13">• лимиты защищают вход.</text>
  </g>
</svg>
