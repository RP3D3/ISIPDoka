<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Поиск с помощью ИИ и проверка ответа</title>
  <desc id="desc">Схема показывает путь от запроса к модели до проверки утверждений и источников.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#eab308"/>
    </marker>
  </defs>
  <rect width="920" height="500" fill="#fffdf5"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2b2410">ИИ помогает искать, но не заменяет проверку</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#2b2410">
    <rect x="25" y="110" width="170" height="100" rx="10" fill="#fff4cc" stroke="#eab308" stroke-width="2"/>
    <text x="110" y="145" text-anchor="middle" font-weight="700">Запрос</text>
    <text x="110" y="170" text-anchor="middle" font-size="12">роль, контекст,</text>
    <text x="110" y="192" text-anchor="middle" font-size="12">формат ответа</text>

    <rect x="230" y="110" width="170" height="100" rx="10" fill="#e3e8ff" stroke="#4c6ef5" stroke-width="2"/>
    <text x="315" y="145" text-anchor="middle" font-weight="700">Ответ модели</text>
    <text x="315" y="170" text-anchor="middle" font-size="12">текст, код, идеи</text>
    <text x="315" y="192" text-anchor="middle" font-size="12">без гарантии истины</text>

    <rect x="435" y="110" width="170" height="100" rx="10" fill="#ffe3d6" stroke="#ff6b35" stroke-width="2"/>
    <text x="520" y="145" text-anchor="middle" font-weight="700">Проверка</text>
    <text x="520" y="170" text-anchor="middle" font-size="12">факты, ссылки,</text>
    <text x="520" y="192" text-anchor="middle" font-size="12">код, версия</text>

    <rect x="640" y="110" width="250" height="100" rx="10" fill="#e8f7ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="765" y="145" text-anchor="middle" font-weight="700">Решение</text>
    <text x="765" y="170" text-anchor="middle" font-size="12">использовать, уточнить</text>
    <text x="765" y="192" text-anchor="middle" font-size="12">или отклонить</text>

    <line x1="195" y1="160" x2="220" y2="160" stroke="#eab308" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="400" y1="160" x2="425" y2="160" stroke="#eab308" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="605" y1="160" x2="630" y2="160" stroke="#eab308" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="120" y="290" width="680" height="130" rx="10" fill="#fff" stroke="#eab308" stroke-width="2"/>
    <text x="460" y="322" text-anchor="middle" font-weight="700">Что проверять обязательно</text>
    <text x="160" y="352" font-size="13">• есть ли ссылка на первоисточник;</text>
    <text x="160" y="376" font-size="13">• не выдуманы ли цитаты и названия;</text>
    <text x="160" y="400" font-size="13">• работает ли код в вашей версии;</text>
    <text x="500" y="352" font-size="13">• не противоречит ли ответ документации;</text>
    <text x="500" y="376" font-size="13">• можно ли воспроизвести результат;</text>
    <text x="500" y="400" font-size="13">• не отдали ли вы секреты в запросе.</text>

    <text x="460" y="462" text-anchor="middle" font-size="13" fill="#5c4a20">Красивый ответ — не доказательство. Доказательство — проверяемый источник и воспроизводимый результат.</text>
  </g>
</svg>
