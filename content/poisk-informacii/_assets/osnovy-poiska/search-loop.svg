<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Цикл поиска информации</title>
  <desc id="desc">Схема показывает путь от вопроса через ключевые слова и оценку выдачи к уточнению запроса.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#eab308"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#fffdf5"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2b2410">Поиск — это цикл, а не одно нажатие</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#2b2410">
    <rect x="30" y="120" width="150" height="90" rx="12" fill="#fff4cc" stroke="#eab308" stroke-width="2"/>
    <text x="105" y="155" text-anchor="middle" font-weight="700">Вопрос</text>
    <text x="105" y="180" text-anchor="middle" font-size="12">что нужно узнать</text>
    <text x="105" y="200" text-anchor="middle" font-size="12">и зачем</text>

    <rect x="220" y="120" width="160" height="90" rx="12" fill="#fff4cc" stroke="#eab308" stroke-width="2"/>
    <text x="300" y="155" text-anchor="middle" font-weight="700">Ключевые слова</text>
    <text x="300" y="180" text-anchor="middle" font-size="12">термины, синонимы,</text>
    <text x="300" y="200" text-anchor="middle" font-size="12">язык</text>

    <rect x="420" y="120" width="150" height="90" rx="12" fill="#e8f7ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="495" y="155" text-anchor="middle" font-weight="700">Выдача</text>
    <text x="495" y="180" text-anchor="middle" font-size="12">сайты, доки,</text>
    <text x="495" y="200" text-anchor="middle" font-size="12">обсуждения</text>

    <rect x="610" y="120" width="150" height="90" rx="12" fill="#e3e8ff" stroke="#4c6ef5" stroke-width="2"/>
    <text x="685" y="155" text-anchor="middle" font-weight="700">Оценка</text>
    <text x="685" y="180" text-anchor="middle" font-size="12">автор, дата,</text>
    <text x="685" y="200" text-anchor="middle" font-size="12">первоисточник</text>

    <rect x="800" y="120" width="90" height="90" rx="12" fill="#ffe3d6" stroke="#ff6b35" stroke-width="2"/>
    <text x="845" y="155" text-anchor="middle" font-weight="700">Уточнение</text>
    <text x="845" y="180" text-anchor="middle" font-size="12">новый</text>
    <text x="845" y="200" text-anchor="middle" font-size="12">запрос</text>

    <line x1="180" y1="165" x2="210" y2="165" stroke="#eab308" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="380" y1="165" x2="410" y2="165" stroke="#eab308" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="570" y1="165" x2="600" y2="165" stroke="#eab308" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="760" y1="165" x2="790" y2="165" stroke="#eab308" stroke-width="2" marker-end="url(#arrow)"/>

    <path d="M 845 220 C 845 300 300 300 300 220" fill="none" stroke="#ff6b35" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <text x="570" y="292" text-anchor="middle" font-size="13" fill="#9a4b20">если ответа нет — меняем запрос, а не сдаёмся</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#5c4a20">
    <text x="30" y="370">Хороший поиск начинается с точного вопроса, а не с первого слова, которое пришло в голову.</text>
    <text x="30" y="398">Один и тот же вопрос можно искать на русском и английском — это часто даёт разные результаты.</text>
    <text x="30" y="426">Оценка источника — обязательная часть поиска, а не дополнительная.</text>
  </g>
</svg>
