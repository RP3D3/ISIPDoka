<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Этика и безопасность при поиске</title>
  <desc id="desc">Схема перечисляет проверку ссылок, приватность, авторское право и защиту от дезинформации.</desc>
  <rect width="920" height="500" fill="#fffdf5"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2b2410">Безопасный и честный поиск</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#2b2410">
    <rect x="35" y="90" width="410" height="100" rx="12" fill="#ffe3d6" stroke="#ff6b35" stroke-width="2"/>
    <text x="55" y="122" font-weight="700">Ссылки и файлы</text>
    <text x="55" y="148" font-size="13">проверяйте домен, расширение, источник;</text>
    <text x="55" y="170" font-size="13">не запускайте неизвестные файлы.</text>

    <rect x="475" y="90" width="410" height="100" rx="12" fill="#fff4cc" stroke="#eab308" stroke-width="2"/>
    <text x="495" y="122" font-weight="700">Приватность</text>
    <text x="495" y="148" font-size="13">не отправляйте в поиск и ИИ пароли,</text>
    <text x="495" y="170" font-size="13">токены, персональные данные.</text>

    <rect x="35" y="220" width="410" height="100" rx="12" fill="#e3e8ff" stroke="#4c6ef5" stroke-width="2"/>
    <text x="55" y="252" font-weight="700">Авторское право</text>
    <text x="55" y="278" font-size="13">цитируйте с указанием автора и источника;</text>
    <text x="55" y="300" font-size="13">не выдавайте чужое за своё.</text>

    <rect x="475" y="220" width="410" height="100" rx="12" fill="#e8f7ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="495" y="252" font-weight="700">Дезинформация</text>
    <text x="495" y="278" font-size="13">проверяйте первоисточник, дату, контекст;</text>
    <text x="495" y="300" font-size="13">не делитесь тем, что не проверили.</text>

    <rect x="100" y="370" width="720" height="80" rx="12" fill="#fff" stroke="#eab308" stroke-width="2"/>
    <text x="460" y="400" text-anchor="middle" font-weight="700">Правило трёх проверок</text>
    <text x="460" y="426" text-anchor="middle" font-size="13" fill="#5c4a20">Кто говорит? На чём основано? Что говорят независимые источники?</text>
  </g>
</svg>
