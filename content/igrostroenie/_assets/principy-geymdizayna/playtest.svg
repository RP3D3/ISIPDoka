<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Цикл плейтеста</title>
  <desc id="desc">Наблюдение, гипотеза, изменение и тест образуют повторяющийся цикл итерации.</desc>
  <rect width="900" height="280" rx="16" fill="#1b1c20"/>

  <text x="24" y="34" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Одна итерация — один вопрос к игре</text>

  <circle cx="450" cy="150" r="74" fill="none" stroke="#4a4d55" stroke-width="1.5" stroke-dasharray="5 5"/>

  <rect x="365" y="38" width="170" height="44" rx="8" fill="#282a30" stroke="#a78bfa" stroke-opacity="0.9"/>
  <text x="450" y="65" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13">1. Наблюдение</text>

  <rect x="650" y="128" width="170" height="44" rx="8" fill="#282a30" stroke="#60a5fa" stroke-opacity="0.9"/>
  <text x="735" y="155" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13">2. Гипотеза</text>

  <rect x="365" y="218" width="170" height="44" rx="8" fill="#282a30" stroke="#fbbf24" stroke-opacity="0.9"/>
  <text x="450" y="245" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13">3. Изменение</text>

  <rect x="80" y="128" width="170" height="44" rx="8" fill="#282a30" stroke="#4ade9a" stroke-opacity="0.9"/>
  <text x="165" y="155" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13">4. Тест</text>

  <path d="M535 60 Q620 70 660 128" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <path d="M654 120 L661 129 L650 132" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <path d="M735 172 Q700 230 535 240" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <path d="M543 246 L534 240 L543 234" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <path d="M365 240 Q250 230 240 172" fill="none" stroke="#4ade9a" stroke-width="2"/>
  <path d="M234 180 L240 171 L246 180" fill="none" stroke="#4ade9a" stroke-width="2"/>
  <path d="M240 128 Q260 70 365 60" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <path d="M357 54 L366 60 L357 66" fill="none" stroke="#a78bfa" stroke-width="2"/>

  <text x="450" y="145" text-anchor="middle" fill="#e7e7ea" font-family="Segoe UI, Arial, sans-serif" font-size="12">1 вопрос</text>
  <text x="450" y="165" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">1 изменение</text>

  <text x="24" y="274" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Сначала смотрите, что человек делает. Потом спрашивайте, что он думал.</text>
</svg>
