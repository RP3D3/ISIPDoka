<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Краны и стоки игровой экономики</title>
  <desc id="desc">Источники ресурсов наполняют кошелёк игрока, траты выводят ресурсы из игры.</desc>
  <rect width="900" height="280" rx="16" fill="#1b1c20"/>

  <text x="24" y="34" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Экономика: краны слева, стоки справа</text>

  <rect x="30" y="55" width="190" height="44" rx="8" fill="#282a30" stroke="#4ade9a" stroke-opacity="0.8"/>
  <text x="125" y="82" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13">Награда за бой</text>
  <rect x="30" y="112" width="190" height="44" rx="8" fill="#282a30" stroke="#4ade9a" stroke-opacity="0.8"/>
  <text x="125" y="139" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13">Квесты и события</text>
  <rect x="30" y="169" width="190" height="44" rx="8" fill="#282a30" stroke="#4ade9a" stroke-opacity="0.8"/>
  <text x="125" y="196" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13">Дроп с врагов</text>
  <text x="125" y="240" text-anchor="middle" fill="#4ade9a" font-family="Segoe UI, Arial, sans-serif" font-size="11">faucets</text>

  <rect x="330" y="92" width="240" height="86" rx="10" fill="#282a30" stroke="#a78bfa" stroke-width="2"/>
  <text x="450" y="122" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Кошелёк игрока</text>
  <text x="450" y="145" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="12">валюта, ресурсы, время</text>
  <text x="450" y="165" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">что накопилось к цели</text>

  <rect x="680" y="55" width="190" height="44" rx="8" fill="#282a30" stroke="#fbbf24" stroke-opacity="0.8"/>
  <text x="775" y="82" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13">Апгрейды</text>
  <rect x="680" y="112" width="190" height="44" rx="8" fill="#282a30" stroke="#fbbf24" stroke-opacity="0.8"/>
  <text x="775" y="139" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13">Ремонт и расходники</text>
  <rect x="680" y="169" width="190" height="44" rx="8" fill="#282a30" stroke="#fbbf24" stroke-opacity="0.8"/>
  <text x="775" y="196" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13">Косметика</text>
  <text x="775" y="240" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="11">sinks</text>

  <path d="M220 77 H300 V120 H330" fill="none" stroke="#4ade9a" stroke-width="2"/>
  <path d="M220 134 H330" fill="none" stroke="#4ade9a" stroke-width="2"/>
  <path d="M220 191 H300 V150 H330" fill="none" stroke="#4ade9a" stroke-width="2"/>
  <path d="M570 120 H610 V77 H680" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <path d="M570 134 H680" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <path d="M570 150 H610 V191 H680" fill="none" stroke="#fbbf24" stroke-width="2"/>

  <text x="450" y="268" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Если кранов больше, чем стоков, валюта обесценивается. Если наоборот — игра превращается в нужду.</text>
</svg>
