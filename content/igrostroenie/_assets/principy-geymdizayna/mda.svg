<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Схема MDA</title>
  <desc id="desc">Три слоя игры: механики, динамика и эстетика, и два направления взгляда на них.</desc>
  <rect width="900" height="280" rx="16" fill="#1b1c20"/>

  <text x="24" y="34" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">MDA: три слоя одной игры</text>

  <rect x="30" y="60" width="230" height="130" rx="10" fill="#282a30" stroke="#a78bfa" stroke-opacity="0.8"/>
  <text x="145" y="90" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Механики</text>
  <text x="145" y="113" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="12">правила и числа</text>
  <text x="145" y="145" text-anchor="middle" fill="#c9c9cc" font-family="Consolas, monospace" font-size="11">здоровье, урон, лут</text>
  <text x="145" y="165" text-anchor="middle" fill="#c9c9cc" font-family="Consolas, monospace" font-size="11">таймеры, спавн</text>

  <rect x="335" y="60" width="230" height="130" rx="10" fill="#282a30" stroke="#60a5fa" stroke-opacity="0.8"/>
  <text x="450" y="90" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Динамика</text>
  <text x="450" y="113" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="12">поведение в игре</text>
  <text x="450" y="145" text-anchor="middle" fill="#c9c9cc" font-family="Consolas, monospace" font-size="11">билды, темп, мета</text>
  <text x="450" y="165" text-anchor="middle" fill="#c9c9cc" font-family="Consolas, monospace" font-size="11">эксплойты, привычки</text>

  <rect x="640" y="60" width="230" height="130" rx="10" fill="#282a30" stroke="#fbbf24" stroke-opacity="0.8"/>
  <text x="755" y="90" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">Эстетика</text>
  <text x="755" y="113" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="12">чувства игрока</text>
  <text x="755" y="145" text-anchor="middle" fill="#c9c9cc" font-family="Consolas, monospace" font-size="11">вызов, азарт</text>
  <text x="755" y="165" text-anchor="middle" fill="#c9c9cc" font-family="Consolas, monospace" font-size="11">фантазия, открытие</text>

  <path d="M260 125 H335" stroke="#a78bfa" stroke-width="2"/>
  <path d="M330 119 L338 125 L330 131" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <path d="M565 125 H640" stroke="#60a5fa" stroke-width="2"/>
  <path d="M635 119 L643 125 L635 131" fill="none" stroke="#60a5fa" stroke-width="2"/>

  <text x="450" y="225" text-anchor="middle" fill="#e7e7ea" font-family="Segoe UI, Arial, sans-serif" font-size="13">Дизайнер идёт от механик к эмоции, игрок — от эмоции к механикам.</text>
  <text x="450" y="250" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="12">Поэтому одну и ту же игру нельзя оценить только по списку правил.</text>
</svg>
