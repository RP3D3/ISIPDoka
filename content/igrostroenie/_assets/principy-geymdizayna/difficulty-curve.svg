<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Кривая сложности и поток</title>
  <desc id="desc">Коридор потока между скукой и тревогой, ступенчатая кривая сложности с передышками.</desc>
  <rect width="900" height="280" rx="16" fill="#1b1c20"/>

  <text x="24" y="34" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Сложность ведёт через коридор потока</text>

  <path d="M90 232 V48" stroke="#4a4d55" stroke-width="1.5"/>
  <path d="M90 232 H820" stroke="#4a4d55" stroke-width="1.5"/>
  <text x="54" y="140" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11" transform="rotate(-90 54 140)">сложность</text>
  <text x="455" y="258" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">время и опыт игрока</text>

  <path d="M90 190 Q250 150 420 120 T820 70 V130 Q650 160 420 180 T90 225 Z" fill="#a78bfa" fill-opacity="0.12"/>
  <path d="M90 190 Q250 150 420 120 T820 70" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M90 225 Q250 195 420 180 T820 130" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="700" y="104" fill="#a78bfa" font-family="Segoe UI, Arial, sans-serif" font-size="11">зона потока</text>

  <path d="M90 218 H160 V204 H230 V188 H300 V176 H370 V150 H440 V162 H510 V136 H580 V120 H650 V96 H720 V110 H790 V78" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <circle cx="160" cy="204" r="3.5" fill="#fbbf24"/>
  <circle cx="440" cy="150" r="3.5" fill="#fbbf24"/>
  <circle cx="510" cy="162" r="3.5" fill="#fbbf24"/>
  <circle cx="790" cy="78" r="3.5" fill="#fbbf24"/>

  <text x="150" y="246" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">старт</text>
  <text x="440" y="140" text-anchor="middle" fill="#e7e7ea" font-family="Segoe UI, Arial, sans-serif" font-size="10">новый приём</text>
  <text x="560" y="184" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">передышка</text>
  <text x="790" y="64" text-anchor="middle" fill="#e7e7ea" font-family="Segoe UI, Arial, sans-serif" font-size="10">проверка</text>

  <text x="24" y="274" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Скука — ниже коридора, тревога — выше. Пила лучше прямой линии.</text>
</svg>
