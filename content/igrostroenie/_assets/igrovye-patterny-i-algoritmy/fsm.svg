<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Конечный автомат врага</title>
  <desc id="desc">Состояния Idle, Patrol, Chase, Attack, Stunned и Dead, соединённые переходами по условиям.</desc>
  <rect width="900" height="340" rx="16" fill="#1b1c20"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9e9ea0"/>
    </marker>
  </defs>

  <rect x="40" y="40" width="150" height="64" rx="10" fill="#282a30" stroke="#60a5fa" stroke-opacity="0.8"/>
  <text x="115" y="68" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Idle</text>
  <text x="115" y="88" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">ждёт игрока</text>

  <rect x="250" y="40" width="150" height="64" rx="10" fill="#282a30" stroke="#34d399" stroke-opacity="0.8"/>
  <text x="325" y="68" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Patrol</text>
  <text x="325" y="88" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">обход точек</text>

  <rect x="460" y="40" width="150" height="64" rx="10" fill="#282a30" stroke="#fbbf24" stroke-opacity="0.8"/>
  <text x="535" y="68" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Chase</text>
  <text x="535" y="88" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">преследование</text>

  <rect x="460" y="210" width="150" height="64" rx="10" fill="#282a30" stroke="#f43f5e" stroke-opacity="0.8"/>
  <text x="535" y="238" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Attack</text>
  <text x="535" y="258" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">анимация удара</text>

  <rect x="250" y="210" width="150" height="64" rx="10" fill="#282a30" stroke="#a78bfa" stroke-opacity="0.8"/>
  <text x="325" y="238" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Stunned</text>
  <text x="325" y="258" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">стан</text>

  <rect x="40" y="210" width="150" height="64" rx="10" fill="#282a30" stroke="#9e9ea0" stroke-opacity="0.8"/>
  <text x="115" y="238" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Dead</text>
  <text x="115" y="258" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">конец жизни</text>

  <path d="M190 72 H244" stroke="#9e9ea0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="217" y="60" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">таймер</text>

  <path d="M400 72 H454" stroke="#9e9ea0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="427" y="60" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">видит</text>

  <path d="M520 104 V204" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="512" y="158" text-anchor="end" fill="#f43f5e" font-family="Segoe UI, Arial, sans-serif" font-size="10">в зоне</text>
  <text x="512" y="172" text-anchor="end" fill="#f43f5e" font-family="Segoe UI, Arial, sans-serif" font-size="10">удара</text>

  <path d="M550 210 V110" stroke="#9e9ea0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="558" y="158" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">цель ушла</text>

  <path d="M480 104 V170 H325 V204" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="184" fill="#a78bfa" font-family="Segoe UI, Arial, sans-serif" font-size="10">стан</text>

  <path d="M325 210 V110" stroke="#9e9ea0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="333" y="150" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">таймер</text>

  <path d="M250 242 H196" stroke="#9e9ea0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="223" y="234" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">HP = 0</text>

  <text x="40" y="316" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Каждая стрелка — это условие перехода; действие выполняется при входе в состояние.</text>
</svg>
