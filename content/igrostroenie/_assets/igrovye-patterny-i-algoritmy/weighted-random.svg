<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Взвешенный рандом</title>
  <desc id="desc">Таблица весов, кумулятивные диапазоны и указатель случайного числа на общей шкале.</desc>
  <rect width="900" height="340" rx="16" fill="#1b1c20"/>

  <text x="40" y="42" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Веса и кумулятивные диапазоны</text>

  <text x="40" y="76" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Предмет</text>
  <text x="210" y="76" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Вес</text>
  <text x="330" y="76" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Диапазон</text>

  <text x="40" y="104" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12">Меч</text>
  <text x="210" y="104" fill="#60a5fa" font-family="Consolas, monospace" font-size="12">50</text>
  <text x="330" y="104" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">0 – 50</text>

  <text x="40" y="132" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12">Зелье</text>
  <text x="210" y="132" fill="#34d399" font-family="Consolas, monospace" font-size="12">30</text>
  <text x="330" y="132" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">50 – 80</text>

  <text x="40" y="160" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12">Кольцо</text>
  <text x="210" y="160" fill="#fbbf24" font-family="Consolas, monospace" font-size="12">15</text>
  <text x="330" y="160" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">80 – 95</text>

  <text x="40" y="188" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12">Артефакт</text>
  <text x="210" y="188" fill="#f43f5e" font-family="Consolas, monospace" font-size="12">5</text>
  <text x="330" y="188" fill="#9e9ea0" font-family="Consolas, monospace" font-size="12">95 – 100</text>

  <rect x="40" y="230" width="410" height="36" fill="#60a5fa" fill-opacity="0.35" stroke="#60a5fa"/>
  <rect x="450" y="230" width="246" height="36" fill="#34d399" fill-opacity="0.35" stroke="#34d399"/>
  <rect x="696" y="230" width="123" height="36" fill="#fbbf24" fill-opacity="0.35" stroke="#fbbf24"/>
  <rect x="819" y="230" width="41" height="36" fill="#f43f5e" fill-opacity="0.35" stroke="#f43f5e"/>

  <text x="245" y="253" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12">50%</text>
  <text x="573" y="253" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12">30%</text>
  <text x="757" y="253" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12">15%</text>
  <text x="839" y="253" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="10">5%</text>

  <path d="M548 206 V228" stroke="#ffffff" stroke-width="2"/>
  <path d="M540 206 H556 L548 218 z" fill="#ffffff"/>
  <text x="548" y="198" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11">r = 62</text>

  <text x="40" y="306" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Одно случайное число 0–100 попадает в диапазон и выбирает предмет за один проход.</text>
</svg>
