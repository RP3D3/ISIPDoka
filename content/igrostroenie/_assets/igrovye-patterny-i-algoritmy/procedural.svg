<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Процедурная генерация уровня</title>
  <desc id="desc">Сид попадает в генератор случайных чисел, создаются комнаты и граф связей, затем выполняется проверка и при ошибке перегенерация.</desc>
  <rect width="900" height="320" rx="16" fill="#1b1c20"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9e9ea0"/>
    </marker>
  </defs>

  <text x="40" y="42" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Сид → комнаты → проверка → уровень</text>

  <rect x="40" y="96" width="120" height="64" rx="10" fill="#282a30" stroke="#a78bfa" stroke-opacity="0.8"/>
  <text x="100" y="124" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Seed</text>
  <text x="100" y="144" text-anchor="middle" fill="#9e9ea0" font-family="Consolas, monospace" font-size="10">1847</text>

  <rect x="200" y="96" width="120" height="64" rx="10" fill="#282a30" stroke="#60a5fa" stroke-opacity="0.8"/>
  <text x="260" y="124" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">PRNG</text>
  <text x="260" y="144" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">поток генерации</text>

  <rect x="360" y="96" width="140" height="64" rx="10" fill="#282a30" stroke="#34d399" stroke-opacity="0.8"/>
  <text x="430" y="124" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Комнаты</text>
  <text x="430" y="144" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">размеры и типы</text>

  <rect x="540" y="96" width="140" height="64" rx="10" fill="#282a30" stroke="#fbbf24" stroke-opacity="0.8"/>
  <text x="610" y="124" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Граф связей</text>
  <text x="610" y="144" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">двери и коридоры</text>

  <rect x="720" y="96" width="140" height="64" rx="10" fill="#282a30" stroke="#f43f5e" stroke-opacity="0.8"/>
  <text x="790" y="124" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Проверка</text>
  <text x="790" y="144" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">связность и выход</text>

  <path d="M160 128 H194" stroke="#9e9ea0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M320 128 H354" stroke="#9e9ea0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500 128 H534" stroke="#9e9ea0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M680 128 H714" stroke="#9e9ea0" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M790 160 V210 H430 V166" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="610" y="202" text-anchor="middle" fill="#f43f5e" font-family="Segoe UI, Arial, sans-serif" font-size="11">не связно или нет выхода → новая попытка</text>

  <rect x="720" y="236" width="140" height="44" rx="10" fill="#282a30" stroke="#34d399"/>
  <text x="790" y="263" text-anchor="middle" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13">Готовый уровень</text>
  <path d="M790 160 V230" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="294" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Один и тот же сид всегда даёт один и тот же уровень — это основа отладки и реплеев.</text>
</svg>
