<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Версии сохранения и атомарная запись</title>
  <desc id="desc">Схема сохранения от версии 1 к версии 3 через миграции и атомарная запись через временный файл и переименование.</desc>
  <rect width="900" height="320" rx="16" fill="#1b1c20"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9e9ea0"/>
    </marker>
  </defs>

  <text x="40" y="42" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Миграции схемы сохранения</text>

  <rect x="40" y="76" width="140" height="72" rx="10" fill="#282a30" stroke="#60a5fa" stroke-opacity="0.8"/>
  <text x="110" y="104" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Сохранение v1</text>
  <text x="110" y="126" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">health, level</text>

  <rect x="270" y="76" width="140" height="72" rx="10" fill="#282a30" stroke="#fbbf24" stroke-opacity="0.8"/>
  <text x="340" y="104" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">v2</text>
  <text x="340" y="126" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">+ inventory</text>

  <rect x="500" y="76" width="140" height="72" rx="10" fill="#282a30" stroke="#34d399" stroke-opacity="0.8"/>
  <text x="570" y="104" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">v3</text>
  <text x="570" y="126" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">+ seed, version</text>

  <path d="M180 112 H264" stroke="#9e9ea0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="222" y="100" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">миграция</text>
  <path d="M410 112 H494" stroke="#9e9ea0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="452" y="100" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="10">миграция</text>

  <text x="40" y="196" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Атомарная запись</text>

  <rect x="40" y="216" width="150" height="48" rx="8" fill="#282a30" stroke="#3a3c44"/>
  <text x="115" y="245" text-anchor="middle" fill="#9e9ea0" font-family="Consolas, monospace" font-size="11">save.tmp</text>

  <rect x="240" y="216" width="120" height="48" rx="8" fill="#282a30" stroke="#3a3c44"/>
  <text x="300" y="245" text-anchor="middle" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="11">flush</text>

  <rect x="410" y="216" width="140" height="48" rx="8" fill="#282a30" stroke="#fbbf24" stroke-opacity="0.8"/>
  <text x="480" y="245" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="11">rename</text>

  <rect x="600" y="216" width="130" height="48" rx="8" fill="#282a30" stroke="#34d399" stroke-opacity="0.8"/>
  <text x="665" y="245" text-anchor="middle" fill="#34d399" font-family="Consolas, monospace" font-size="11">save.json</text>

  <path d="M190 240 H234" stroke="#9e9ea0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M360 240 H404" stroke="#9e9ea0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M550 240 H594" stroke="#9e9ea0" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="40" y="296" fill="#9e9ea0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Пишем во временный файл и подменяем основной — сбой не оставит половину сохранения.</text>
</svg>
