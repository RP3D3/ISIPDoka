<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">reflog и bisect для расследования</title>
  <desc id="desc">Схема показывает восстановление через reflog и поиск бага через bisect.</desc>
  <rect width="920" height="520" fill="#fffaf7"/>
  <text x="460" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2d1b12">Два инструмента расследования</text>

  <g font-family="Arial, sans-serif" font-size="13" fill="#2d1b12">
    <rect x="30" y="80" width="420" height="390" rx="14" fill="#fff" stroke="#ff6b35" stroke-width="2"/>
    <text x="240" y="112" text-anchor="middle" font-size="18" font-weight="700">reflog</text>
    <text x="240" y="136" text-anchor="middle" font-size="12" fill="#5c4033">журнал перемещений HEAD</text>

    <line x1="70" y1="210" x2="410" y2="210" stroke="#ff6b35" stroke-width="3"/>
    <circle cx="100" cy="210" r="12" fill="#ff6b35"/>
    <circle cx="190" cy="210" r="12" fill="#ff6b35"/>
    <circle cx="280" cy="210" r="12" fill="#ff6b35"/>
    <circle cx="370" cy="210" r="12" fill="#ff6b35"/>
    <text x="100" y="185" text-anchor="middle">A</text>
    <text x="190" y="185" text-anchor="middle">B</text>
    <text x="280" y="185" text-anchor="middle">C</text>
    <text x="370" y="185" text-anchor="middle">D</text>

    <path d="M 370 222 C 370 280 280 280 280 250" fill="none" stroke="#4c6ef5" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="330" y="292" text-anchor="middle" font-size="12" fill="#3b4fb8">reset --hard</text>
    <text x="240" y="340" text-anchor="middle" font-size="13" fill="#5c4033">`git reflog` показывает, где был HEAD</text>
    <text x="240" y="364" text-anchor="middle" font-size="13" fill="#5c4033">даже после «потери» коммита</text>
    <text x="240" y="400" text-anchor="middle" font-size="13" fill="#5c4033">`git reset --hard HEAD@{1}` возвращает</text>
    <text x="240" y="424" text-anchor="middle" font-size="13" fill="#5c4033">предыдущее состояние</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#2d1b12">
    <rect x="470" y="80" width="420" height="390" rx="14" fill="#fff" stroke="#2f9e44" stroke-width="2"/>
    <text x="680" y="112" text-anchor="middle" font-size="18" font-weight="700">bisect</text>
    <text x="680" y="136" text-anchor="middle" font-size="12" fill="#5c4033">двоичный поиск плохого коммита</text>

    <line x1="510" y1="220" x2="850" y2="220" stroke="#2f9e44" stroke-width="3"/>
    <circle cx="530" cy="220" r="12" fill="#2f9e44"/>
    <circle cx="600" cy="220" r="12" fill="#2f9e44"/>
    <circle cx="670" cy="220" r="12" fill="#ff6b35"/>
    <circle cx="740" cy="220" r="12" fill="#ff6b35"/>
    <circle cx="810" cy="220" r="12" fill="#ff6b35"/>
    <text x="530" y="195" text-anchor="middle">good</text>
    <text x="600" y="195" text-anchor="middle">good</text>
    <text x="670" y="195" text-anchor="middle">?</text>
    <text x="740" y="195" text-anchor="middle">?</text>
    <text x="810" y="195" text-anchor="middle">bad</text>

    <text x="680" y="300" text-anchor="middle" font-size="13" fill="#5c4033">`git bisect start`</text>
    <text x="680" y="324" text-anchor="middle" font-size="13" fill="#5c4033">`git bisect bad` / `git bisect good`</text>
    <text x="680" y="348" text-anchor="middle" font-size="13" fill="#5c4033">Git сам выбирает середину</text>
    <text x="680" y="384" text-anchor="middle" font-size="13" fill="#5c4033">За log2(N) проверок находится</text>
    <text x="680" y="408" text-anchor="middle" font-size="13" fill="#5c4033">первый плохой коммит</text>
  </g>
</svg>
