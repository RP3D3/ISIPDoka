<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Стратегии ветвления: Git Flow и trunk-based</title>
  <desc id="desc">Сравнение Git Flow с долгоживущими ветками и trunk-based разработки с короткими ветками.</desc>
  <rect width="920" height="520" fill="#fffaf7"/>
  <text x="460" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2d1b12">Две стратегии ветвления</text>

  <g font-family="Arial, sans-serif" font-size="13" fill="#2d1b12">
    <rect x="30" y="80" width="420" height="390" rx="14" fill="#fff" stroke="#ff6b35" stroke-width="2"/>
    <text x="240" y="112" text-anchor="middle" font-size="18" font-weight="700">Git Flow</text>
    <text x="240" y="136" text-anchor="middle" font-size="12" fill="#5c4033">долгоживущие ветки и релизы</text>

    <line x1="60" y1="180" x2="420" y2="180" stroke="#ff6b35" stroke-width="3"/>
    <text x="50" y="170" font-size="12" fill="#7a3b20">main</text>
    <line x1="60" y1="240" x2="420" y2="240" stroke="#4c6ef5" stroke-width="3"/>
    <text x="50" y="230" font-size="12" fill="#3b4fb8">develop</text>
    <line x1="130" y1="240" x2="130" y2="300" stroke="#2f9e44" stroke-width="2"/>
    <line x1="130" y1="300" x2="250" y2="300" stroke="#2f9e44" stroke-width="2"/>
    <line x1="250" y1="300" x2="250" y2="240" stroke="#2f9e44" stroke-width="2"/>
    <text x="190" y="320" text-anchor="middle" font-size="12" fill="#2b6b3a">feature</text>
    <line x1="300" y1="240" x2="300" y2="200" stroke="#9c36b5" stroke-width="2"/>
    <line x1="300" y1="200" x2="390" y2="200" stroke="#9c36b5" stroke-width="2"/>
    <line x1="390" y1="200" x2="390" y2="180" stroke="#9c36b5" stroke-width="2"/>
    <text x="350" y="192" text-anchor="middle" font-size="12" fill="#7a2a8f">release</text>
    <text x="240" y="370" text-anchor="middle" font-size="12" fill="#5c4033">main ← release ← develop</text>
    <text x="240" y="394" text-anchor="middle" font-size="12" fill="#5c4033">hotfix идёт в main и develop</text>
    <text x="240" y="426" text-anchor="middle" font-size="12" fill="#5c4033">Подходит для версионируемых продуктов</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#2d1b12">
    <rect x="470" y="80" width="420" height="390" rx="14" fill="#fff" stroke="#2f9e44" stroke-width="2"/>
    <text x="680" y="112" text-anchor="middle" font-size="18" font-weight="700">Trunk-based</text>
    <text x="680" y="136" text-anchor="middle" font-size="12" fill="#5c4033">короткие ветки и частый merge</text>

    <line x1="500" y1="220" x2="860" y2="220" stroke="#2f9e44" stroke-width="3"/>
    <text x="490" y="210" font-size="12" fill="#2b6b3a">main</text>
    <line x1="560" y1="220" x2="560" y2="280" stroke="#4c6ef5" stroke-width="2"/>
    <line x1="560" y1="280" x2="620" y2="280" stroke="#4c6ef5" stroke-width="2"/>
    <line x1="620" y1="280" x2="620" y2="220" stroke="#4c6ef5" stroke-width="2"/>
    <text x="590" y="300" text-anchor="middle" font-size="12" fill="#3b4fb8">ветка на 1–2 дня</text>
    <line x1="700" y1="220" x2="700" y2="280" stroke="#4c6ef5" stroke-width="2"/>
    <line x1="700" y1="280" x2="760" y2="280" stroke="#4c6ef5" stroke-width="2"/>
    <line x1="760" y1="280" x2="760" y2="220" stroke="#4c6ef5" stroke-width="2"/>
    <text x="730" y="300" text-anchor="middle" font-size="12" fill="#3b4fb8">ещё одна ветка</text>
    <text x="680" y="370" text-anchor="middle" font-size="12" fill="#5c4033">маленькие PR, частые релизы</text>
    <text x="680" y="394" text-anchor="middle" font-size="12" fill="#5c4033">меньше конфликтов и долгих merge</text>
    <text x="680" y="426" text-anchor="middle" font-size="12" fill="#5c4033">Нужны хорошие тесты и CI</text>
  </g>
</svg>
