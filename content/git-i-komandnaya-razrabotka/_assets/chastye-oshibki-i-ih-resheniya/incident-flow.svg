<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc">
  <title id="title">Разбор инцидента в Git</title>
  <desc id="desc">Схема показывает путь от симптома к диагностике, исправлению и профилактике.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b35"/>
    </marker>
  </defs>
  <rect width="920" height="480" fill="#fffaf7"/>
  <text x="460" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2d1b12">Как разбирать ошибку, а не паниковать</text>
  <g font-family="Arial, sans-serif" font-size="14" fill="#2d1b12">
    <rect x="30" y="120" width="180" height="100" rx="12" fill="#ffe3d6" stroke="#ff6b35" stroke-width="2"/>
    <text x="120" y="156" text-anchor="middle" font-weight="700">Симптом</text>
    <text x="120" y="182" text-anchor="middle" font-size="12">что именно сломалось</text>
    <text x="120" y="204" text-anchor="middle" font-size="12">и когда</text>

    <rect x="260" y="120" width="180" height="100" rx="12" fill="#fff1cc" stroke="#e0a100" stroke-width="2"/>
    <text x="350" y="156" text-anchor="middle" font-weight="700">Диагностика</text>
    <text x="350" y="182" text-anchor="middle" font-size="12">status, log, reflog</text>
    <text x="350" y="204" text-anchor="middle" font-size="12">diff, bisect</text>

    <rect x="490" y="120" width="180" height="100" rx="12" fill="#e8f7ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="580" y="156" text-anchor="middle" font-weight="700">Исправление</text>
    <text x="580" y="182" text-anchor="middle" font-size="12">минимальное действие</text>
    <text x="580" y="204" text-anchor="middle" font-size="12">с резервной копией</text>

    <rect x="720" y="120" width="170" height="100" rx="12" fill="#e3e8ff" stroke="#4c6ef5" stroke-width="2"/>
    <text x="805" y="156" text-anchor="middle" font-weight="700">Профилактика</text>
    <text x="805" y="182" text-anchor="middle" font-size="12">правило, тест,</text>
    <text x="805" y="204" text-anchor="middle" font-size="12">проверка в CI</text>

    <line x1="210" y1="170" x2="250" y2="170" stroke="#ff6b35" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="440" y1="170" x2="480" y2="170" stroke="#ff6b35" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="670" y1="170" x2="710" y2="170" stroke="#ff6b35" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="460" y="290" text-anchor="middle" font-size="13" fill="#5c4033">Перед исправлением: сохранить текущее состояние ветки или сделать копию.</text>
    <text x="460" y="318" text-anchor="middle" font-size="13" fill="#5c4033">После исправления: записать причину и добавить проверку, которая не даст повторить.</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#2d1b12">
    <rect x="80" y="370" width="760" height="60" rx="10" fill="#fff" stroke="#ff6b35" stroke-width="2"/>
    <text x="460" y="396" text-anchor="middle" font-weight="700">Не делайте `reset --hard`, `push --force` и удаление ветки, пока не поняли причину.</text>
    <text x="460" y="418" text-anchor="middle" font-size="12" fill="#5c4033">Сначала диагностика, потом действие.</text>
  </g>
</svg>
