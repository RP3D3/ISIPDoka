<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Чек-лист качества и безопасности репозитория</title>
  <desc id="desc">Схема перечисляет README, лицензию, секреты, права, подписи и зависимости.</desc>
  <rect width="900" height="520" fill="#fffaf7"/>
  <text x="450" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2d1b12">Репозиторий, которому можно доверять</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#2d1b12">
    <rect x="50" y="90" width="380" height="70" rx="10" fill="#e8f7ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="75" y="120" font-weight="700">README</text>
    <text x="75" y="144" font-size="13">что это, как запустить, как помочь</text>

    <rect x="470" y="90" width="380" height="70" rx="10" fill="#e8f7ee" stroke="#2f9e44" stroke-width="2"/>
    <text x="495" y="120" font-weight="700">LICENSE</text>
    <text x="495" y="144" font-size="13">что можно делать с кодом</text>

    <rect x="50" y="190" width="380" height="70" rx="10" fill="#fff1cc" stroke="#e0a100" stroke-width="2"/>
    <text x="75" y="220" font-weight="700">CONTRIBUTING</text>
    <text x="75" y="244" font-size="13">как предложить изменение и запустить тесты</text>

    <rect x="470" y="190" width="380" height="70" rx="10" fill="#fff1cc" stroke="#e0a100" stroke-width="2"/>
    <text x="495" y="220" font-weight="700">Шаблоны issue и PR</text>
    <text x="495" y="244" font-size="13">какую информацию нужно приложить</text>

    <rect x="50" y="290" width="380" height="70" rx="10" fill="#ffe3d6" stroke="#ff6b35" stroke-width="2"/>
    <text x="75" y="320" font-weight="700">Секреты</text>
    <text x="75" y="344" font-size="13">`.env`, ключи и токены не в Git</text>

    <rect x="470" y="290" width="380" height="70" rx="10" fill="#ffe3d6" stroke="#ff6b35" stroke-width="2"/>
    <text x="495" y="320" font-weight="700">Права доступа</text>
    <text x="495" y="344" font-size="13">кто может push, merge и менять настройки</text>

    <rect x="50" y="390" width="380" height="70" rx="10" fill="#e3e8ff" stroke="#4c6ef5" stroke-width="2"/>
    <text x="75" y="420" font-weight="700">Подписанные коммиты</text>
    <text x="75" y="444" font-size="13">авторство можно проверить</text>

    <rect x="470" y="390" width="380" height="70" rx="10" fill="#e3e8ff" stroke="#4c6ef5" stroke-width="2"/>
    <text x="495" y="420" font-weight="700">Зависимости</text>
    <text x="495" y="444" font-size="13">обновления и известные уязвимости</text>
  </g>
</svg>
